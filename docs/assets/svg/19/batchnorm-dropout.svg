<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">BatchNorm 使用批统计与可学习仿射参数，Dropout 只在训练时随机失活</title><desc id="desc">BatchNorm 对 mini-batch 每个特征维计算均值和方差，再用 gamma 与 beta 缩放平移；推理用运行统计。Inverted Dropout 训练时按保留概率 q 对保留激活除以 q，推理时恒等。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">两种机制解决不同问题，不是同一个开关</text><rect x="35" y="105" width="430" height="260" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="60" y="143" font-size="19" fill="#147b70" font-weight="750" text-anchor="start">Batch Normalization</text><rect x="65" y="170" width="125" height="65" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="127" y="196" font-size="16" fill="#147b70" font-weight="700" text-anchor="middle">batch x</text><text x="127" y="219" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">μ_B, σ²_B</text><path d="M193 202 L245 202" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="250" y="170" width="175" height="65" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="337" y="196" font-size="16" fill="#7863b0" font-weight="700" text-anchor="middle">标准化</text><text x="337" y="219" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">再乘 γ 加 β</text><text x="60" y="278" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">train：更新 running mean / variance</text><text x="60" y="307" font-size="13" fill="#52675f" font-weight="550" text-anchor="start">eval：使用运行统计，不再重算 batch 统计</text><rect x="535" y="105" width="430" height="260" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="560" y="143" font-size="19" fill="#bc6a47" font-weight="750" text-anchor="start">Inverted Dropout</text><rect x="565" y="170" width="125" height="65" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="627" y="196" font-size="16" fill="#147b70" font-weight="700" text-anchor="middle">激活 h</text><text x="627" y="219" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">q = 1 − p</text><path d="M693 202 L745 202" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="750" y="170" width="175" height="65" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="837" y="196" font-size="15" fill="#bc6a47" font-weight="700" text-anchor="middle">mask ⊙ h / q</text><text x="837" y="219" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">随机失活</text><text x="560" y="278" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">train：随机 mask，保持期望激活量</text><text x="560" y="307" font-size="13" fill="#52675f" font-weight="550" text-anchor="start">eval：恒等映射，不再采样 mask</text><text x="36" y="410" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">BatchNorm 依赖 batch 统计；小 batch、分布变化与 train/eval 模式需单独审查。</text></g></svg>