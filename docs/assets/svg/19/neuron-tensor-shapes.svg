<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">一个全连接神经元把输入向量映射为一个激活输出</title><desc id="desc">批量输入 X 的形状是 B×d，权重向量 w 的长度为 d，偏置 b 为标量；每行输入计算点积加偏置得到 z，再经非线性激活得到 a，输出形状 B×1。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">神经元：线性组合 → 非线性变换</text><rect x="38" y="125" width="180" height="145" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="128" y="158" font-size="19" fill="#147b70" font-weight="750" text-anchor="middle">输入 X</text><text x="128" y="190" font-size="21" fill="#203a36" font-weight="700" text-anchor="middle">B × d</text><text x="128" y="222" font-size="14" fill="#52675f" font-weight="500" text-anchor="middle">[x₁, x₂, …, x_d]</text><path d="M220 198 L295 198" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="300" y="125" width="185" height="145" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="392" y="158" font-size="19" fill="#bc6a47" font-weight="750" text-anchor="middle">线性组合</text><text x="392" y="194" font-size="18" fill="#203a36" font-weight="700" text-anchor="middle">z = wᵀx + b</text><text x="392" y="228" font-size="14" fill="#52675f" font-weight="500" text-anchor="middle">w: d 维 · b: 标量</text><path d="M487 198 L560 198" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="565" y="125" width="155" height="145" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="642" y="158" font-size="19" fill="#7863b0" font-weight="750" text-anchor="middle">激活函数</text><text x="642" y="196" font-size="21" fill="#203a36" font-weight="700" text-anchor="middle">a = φ(z)</text><text x="642" y="228" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">ReLU / tanh / sigmoid</text><path d="M722 198 L795 198" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="800" y="125" width="160" height="145" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="880" y="158" font-size="19" fill="#147b70" font-weight="750" text-anchor="middle">输出 a</text><text x="880" y="194" font-size="21" fill="#203a36" font-weight="700" text-anchor="middle">B × 1</text><text x="880" y="228" font-size="14" fill="#52675f" font-weight="500" text-anchor="middle">逐样本一个数</text><text x="36" y="350" font-size="21" fill="#203a36" font-weight="750" text-anchor="start">批量矩阵形式： Z = XWᵀ + b， A = φ(Z)</text><text x="36" y="395" font-size="15" fill="#52675f" font-weight="550" text-anchor="start">若有 H 个神经元，W 形状为 H×d，输出形状为 B×H。</text></g></svg>