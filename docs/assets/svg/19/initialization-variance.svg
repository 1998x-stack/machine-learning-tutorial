<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">初始化控制前向激活与反向梯度的方差传播</title><desc id="desc">示意多层网络中的方差传播趋势：初始化过大可能导致激活/梯度爆炸，过小可能导致衰减。Xavier 和 He 初始化根据 fan-in/fan-out 与激活假设选择尺度。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">初始化要避免信号跨层放大或衰减</text><text x="70" y="104" font-size="14" fill="#6a7b73" font-weight="650" text-anchor="start">层</text><text x="220" y="104" font-size="14" fill="#6a7b73" font-weight="650" text-anchor="middle">输入</text><text x="430" y="104" font-size="14" fill="#6a7b73" font-weight="650" text-anchor="middle">隐藏层 1</text><text x="640" y="104" font-size="14" fill="#6a7b73" font-weight="650" text-anchor="middle">隐藏层 2</text><text x="850" y="104" font-size="14" fill="#6a7b73" font-weight="650" text-anchor="middle">输出</text><path d="M110 125 L110 350" fill="none" stroke="#d7dfd9" stroke-width="1" stroke-linecap="round"/><path d="M220 210 C300 130 350 130 430 210 S560 290 640 210 S770 130 850 210" fill="none" stroke="#147b70" stroke-width="4"/><path d="M220 210 C300 80 350 80 430 210 S560 340 640 210 S770 80 850 210" fill="none" stroke="#bc6a47" stroke-width="3" stroke-dasharray="7 6"/><path d="M220 210 C300 195 350 195 430 210 S560 225 640 210 S770 195 850 210" fill="none" stroke="#7863b0" stroke-width="3" stroke-dasharray="3 5"/><text x="700" y="145" font-size="13" fill="#bc6a47" font-weight="650" text-anchor="start">过大：可能放大</text><text x="700" y="235" font-size="13" fill="#147b70" font-weight="650" text-anchor="start">合适尺度：稳定传播</text><text x="700" y="260" font-size="13" fill="#7863b0" font-weight="650" text-anchor="start">过小：可能衰减</text><rect x="45" y="365" width="435" height="55" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="65" y="399" font-size="15" fill="#304442" font-weight="650" text-anchor="start">Xavier：Var(W) ≈ 2 / (fan_in + fan_out)</text><rect x="510" y="365" width="445" height="55" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="530" y="399" font-size="15" fill="#304442" font-weight="650" text-anchor="start">He / Kaiming：Var(W) ≈ 2 / fan_in（ReLU）</text></g></svg>