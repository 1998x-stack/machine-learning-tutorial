<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Sigmoid、tanh 与 ReLU 的函数形状和梯度特征</title><desc id="desc">曲线分别是 sigmoid、tanh 和 ReLU 的解析函数。sigmoid 和 tanh 在大绝对值处饱和，ReLU 在负半轴导数为零而正半轴导数为一。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">激活函数改变梯度如何穿过网络</text><path d="M95 245 L900 245" fill="none" stroke="#9aa9a1" stroke-width="1.5" stroke-linecap="round"/><path d="M495 90 L495 385" fill="none" stroke="#9aa9a1" stroke-width="1.5" stroke-linecap="round"/><text x="910" y="250" font-size="14" fill="#6a7b73" font-weight="600" text-anchor="start">x</text><text x="505" y="91" font-size="14" fill="#6a7b73" font-weight="600" text-anchor="start">y</text><path d="M95 120 L900 120" fill="none" stroke="#e5e9e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 5"/><path d="M95 370 L900 370" fill="none" stroke="#e5e9e4" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 5"/><path d="M95 245 L900 245" fill="none" stroke="#d4ddd6" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 5"/><path d="M95 368 C180 366 250 345 330 310 S445 265 495 245 S545 225 660 180 S810 130 900 122" fill="none" stroke="#7863b0" stroke-width="3.5"/><path d="M95 370 C180 370 275 368 355 330 S450 265 495 245 S540 225 635 160 S800 122 900 120" fill="none" stroke="#bc6a47" stroke-width="3" stroke-dasharray="7 5"/><path d="M95 245 L495 245 L900 105" fill="none" stroke="#147b70" stroke-width="4" stroke-linecap="round"/><text x="780" y="95" font-size="15" fill="#147b70" font-weight="750" text-anchor="start">ReLU</text><text x="780" y="145" font-size="15" fill="#bc6a47" font-weight="750" text-anchor="start">sigmoid</text><text x="780" y="180" font-size="15" fill="#7863b0" font-weight="750" text-anchor="start">tanh</text><text x="36" y="417" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">曲线仅示意梯度性质；网络是否稳定还取决于初始化、深度、归一化与优化器。</text></g></svg>