<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">反向传播沿计算图用链式法则传播梯度</title><desc id="desc">前向从输入 x 经过 z1、a1、z2 得到损失 L；反向从 dL/dz2 开始，按链式法则得到 dL/da1、dL/dz1 与各参数梯度。箭头方向与计算依赖相反。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6" marker-end="url(#arr)"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6" marker-end="url(#rev)"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">前向计算，反向求导，优化器最后更新</text><rect x="38" y="135" width="130" height="90" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="103" y="170" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">输入 x</text><text x="103" y="197" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">B × d</text><rect x="220" y="135" width="140" height="90" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="290" y="170" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="middle">线性层</text><text x="290" y="197" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">z₁ = W₁x+b₁</text><rect x="412" y="135" width="130" height="90" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="477" y="170" font-size="18" fill="#7863b0" font-weight="750" text-anchor="middle">激活</text><text x="477" y="197" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">a₁ = φ(z₁)</text><rect x="594" y="135" width="140" height="90" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="664" y="170" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="middle">输出层</text><text x="664" y="197" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">z₂ = W₂a₁+b₂</text><rect x="786" y="135" width="170" height="90" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="871" y="170" font-size="18" fill="#7863b0" font-weight="750" text-anchor="middle">损失 L</text><text x="871" y="197" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">与目标比较</text><path d="M170 180 L216 180" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M362 180 L408 180" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M544 180 L590 180" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M736 180 L782 180" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M870 235 L870 302" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><path d="M870 302 L665 302" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><path d="M665 302 L665 235" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><path d="M665 302 L478 302" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><path d="M478 302 L478 235" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><path d="M478 302 L290 302" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><path d="M290 302 L290 235" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round" marker-end="url(#rev)"/><text x="870" y="330" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">∂L / ∂z₂</text><text x="665" y="330" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">∂L / ∂a₁</text><text x="478" y="330" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">∂L / ∂z₁</text><text x="290" y="330" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">∂L / ∂W₁</text><text x="36" y="405" font-size="15" fill="#52675f" font-weight="550" text-anchor="start">反向传播只计算梯度；参数更新由 optimizer.step() 执行。</text></g></svg>