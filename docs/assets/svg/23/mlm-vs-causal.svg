<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="nlp-objectives-title nlp-objectives-desc">
<title id="nlp-objectives-title">BERT 的遮盖词预测与 GPT 的下一 token 预测</title><desc id="nlp-objectives-desc">MLM 在输入中遮盖部分 token 并预测被遮盖位置；causal LM 预测下一个 token，注意力只能看左侧上下文。</desc>
<defs>
 <marker id="nlp-objectives-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="nlp-objectives-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#nlp-objectives-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#nlp-objectives-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">预训练目标塑造可用上下文与输出方式</text>
<text x="70" y="105" class="label">BERT 风格 · Masked Language Modeling</text>
<rect x="70" y="135" width="125" height="56" rx="9" class="green"/><text x="132" y="170" text-anchor="middle" class="label">我</text><rect x="215" y="135" width="125" height="56" rx="9" class="green"/><text x="277" y="170" text-anchor="middle" class="label">喜欢</text><rect x="360" y="135" width="125" height="56" rx="9" class="orange"/><text x="422" y="170" text-anchor="middle" class="label">[MASK]</text><rect x="505" y="135" width="125" height="56" rx="9" class="green"/><text x="567" y="170" text-anchor="middle" class="label">学习</text><rect x="650" y="135" width="125" height="56" rx="9" class="green"/><text x="712" y="170" text-anchor="middle" class="label">。</text>
<path d="M132 200 V225 H485 V245" class="line"/><rect x="370" y="250" width="230" height="56" rx="10" class="purple"/><text x="485" y="285" text-anchor="middle" class="label">预测被遮盖的 token</text>
<line x1="50" y1="330" x2="850" y2="330" stroke="#d5ddd5"/>
<text x="70" y="370" class="label">GPT 风格 · Causal next-token prediction</text>
<rect x="70" y="390" width="125" height="45" rx="8" class="green"/><text x="132" y="418" text-anchor="middle" class="small">我</text><rect x="215" y="390" width="125" height="45" rx="8" class="green"/><text x="277" y="418" text-anchor="middle" class="small">喜欢</text><rect x="360" y="390" width="125" height="45" rx="8" class="green"/><text x="422" y="418" text-anchor="middle" class="small">机器</text><rect x="505" y="390" width="125" height="45" rx="8" class="green"/><text x="567" y="418" text-anchor="middle" class="small">学习</text><rect x="650" y="390" width="125" height="45" rx="8" class="orange"/><text x="712" y="418" text-anchor="middle" class="small">。</text>
<text x="70" y="455" class="tiny">每个位置只用左侧 token 预测下一个；此图为目标示意，不代表完整训练流程。</text>
</svg>