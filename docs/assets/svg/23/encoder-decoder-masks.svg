<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="nlp-masks-title nlp-masks-desc">
<title id="nlp-masks-title">编码器双向注意力与解码器因果掩码</title><desc id="nlp-masks-desc">Encoder 可在同一输入中双向读取；自回归 decoder 的第 t 个位置只能读取不晚于 t 的 key。</desc>
