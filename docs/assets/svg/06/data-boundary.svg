<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="s-title s-desc"><title id="s-title">真实回归项目的训练、验证和测试边界</title><desc id="s-desc">先定义预测时间与特征可用性，再划分训练、验证和测试；只有训练集合可用于预处理的拟合。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58716d" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d7e2da"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="44" font-size="23" fill="#203735" font-weight="760" text-anchor="start">数据边界比换更复杂的模型重要</text>
<rect x="35" y="93" width="208" height="79" rx="13" fill="#e8f4ee" stroke="#d7e2da"/><text x="53" y="122" font-size="19" fill="#13796b" font-weight="750" text-anchor="start">任务：预测房价</text><text x="53" y="148" font-size="13" fill="#58716d" font-weight="500" text-anchor="start">定义目标时间与可用特征</text>
<path d="M246 134 H287" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/><rect x="292" y="93" width="197" height="79" rx="13" fill="#fff" stroke="#d7e2da"/><text x="308" y="122" font-size="18" fill="#203735" font-weight="740" text-anchor="start">选择切分策略</text><text x="308" y="148" font-size="13" fill="#58716d" font-weight="500" text-anchor="start">随机 / 地理组 / 时间</text>
<path d="M492 134 H535" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M537 108 V343" fill="none" stroke="#d7e2da" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="559" y="90" width="211" height="78" rx="13" fill="#e8f4ee" stroke="#d7e2da"/><text x="575" y="118" font-size="18" fill="#13796b" font-weight="740" text-anchor="start">训练集</text><text x="575" y="145" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">fit 预处理与参数</text>
<rect x="559" y="206" width="211" height="78" rx="13" fill="#faefe7" stroke="#d7e2da"/><text x="575" y="234" font-size="18" fill="#bb6842" font-weight="740" text-anchor="start">验证集</text><text x="575" y="260" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">选择超参数与模型</text>
<rect x="799" y="144" width="168" height="105" rx="13" fill="#eeeaf7" stroke="#d7e2da"/><text x="813" y="173" font-size="18" fill="#7760b1" font-weight="750" text-anchor="start">测试集</text><text x="813" y="197" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">仅最终报告一次</text><text x="813" y="221" font-size="13" fill="#58716d" font-weight="500" text-anchor="start">禁止选择模型</text>
<path d="M664 169 V200" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M492 134 H794 V150" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="36" y="324" width="466" height="66" rx="13" fill="#f4f7f3" stroke="#d7e2da"/><text x="54" y="350" font-size="17" fill="#203735" font-weight="700" text-anchor="start">每一次交叉验证的 fit 都要重新学习统计量</text><text x="54" y="373" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">均值 / 编码字典 / 特征选择都不例外</text>
<text x="556" y="358" font-size="15" fill="#bb6842" font-weight="700" text-anchor="start">部署时还需考虑地理与时间分布变化</text>
</g></svg>