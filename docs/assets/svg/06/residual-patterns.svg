="#bb6842" stroke="#fff" stroke-width="2"/><circle cx="828" cy="143.15" r="6" fill="#bb6842" stroke="#fff" stroke-width="2"/><circle cx="866" cy="128.2" r="6" fill="#bb6842" stroke="#fff" stroke-width="2"/><circle cx="904" cy="119.00000000000001" r="6" fill="#bb6842" stroke="#fff" stroke-width="2"/><text x="582" y="356" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">预测值 →</text><text x="540" y="155" font-size="13" fill="#58716d" font-weight="500" text-anchor="start">残差</text><text x="743" y="265" font-size="13" fill="#7760b1" font-weight="500" text-anchor="start">零残差线</text>
