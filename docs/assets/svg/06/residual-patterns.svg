<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="s-title s-desc"><title id="s-title">残差随机散布与系统性偏差</title><desc id="s-desc">两幅人工构造的残差示意：一幅围绕零上下波动，一幅随预测值产生系统趋势；需要分组和数据漂移检查。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58716d" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d7e2da"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="43" font-size="22" fill="#203735" font-weight="760" text-anchor="start">同一个平均误差可能掩盖不同的系统性失败</text>
