<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="s-title s-desc"><title id="s-title">基线模型、候选模型和验证指标选择</title><desc id="s-desc">以训练集上的常数预测作为基线，同时训练含特征的候选模型；统一在验证集计算 RMSE/MAE，然后才进行测试。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58716d" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d7e2da"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="44" font-size="22" fill="#203735" font-weight="760" text-anchor="start">先判断模型有没有超过常数预测基线</text>
<rect x="37" y="108" width="194" height="85" rx="13" fill="#e8f4ee" stroke="#d7e2da"/><text x="52" y="137" font-size="20" fill="#13796b" font-weight="750" text-anchor="start">训练集</text><text x="52" y="166" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">X_train / y_train</text>
<path d="M232 151 H266 V97 H297" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M266 151 V277 H297" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="302" y="75" width="292" height="87" rx="13" fill="#fff" stroke="#d7e2da"/><text x="317" y="105" font-size="18" fill="#13796b" font-weight="740" text-anchor="start">基线 DummyRegressor</text><text x="317" y="134" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">预测训练集均值或中位数</text>
<rect x="302" y="239" width="292" height="86" rx="13" fill="#faefe7" stroke="#d7e2da"/><text x="317" y="270" font-size="18" fill="#bb6842" font-weight="740" text-anchor="start">候选 Ridge / Forest</text><text x="317" y="299" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">学习特征与目标之间的关系</text>
<path d="M596 120 H640 V203 H679" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/><path d="M596 284 H640 V225 H679" fill="none" stroke="#58716d" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="685" y="166" width="272" height="112" rx="13" fill="#eeeaf7" stroke="#d7e2da"/><text x="704" y="197" font-size="19" fill="#7760b1" font-weight="760" text-anchor="start">同一验证集比较</text><text x="704" y="225" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">RMSE：放大大误差的影响</text><text x="704" y="253" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">MAE：平均绝对误差</text>
<rect x="38" y="359" width="921" height="46" rx="13" fill="#f4f7f3" stroke="#d7e2da"/><text x="56" y="387" font-size="16" fill="#58716d" font-weight="500" text-anchor="start">这是实验设计，不是结果排行榜；只能在选定模型后使用隔离测试集。</text>
</g></svg>