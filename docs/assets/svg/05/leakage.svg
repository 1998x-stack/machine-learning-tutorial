<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">正确与错误的数据处理顺序</title><desc id="d">错误流程是在拆分数据前用全量数据拟合填充器或标准化器；正确流程先切分，只在训练集 fit，再对验证和测试集 transform。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="37" y="42" font-size="22" fill="#203735" font-weight="750" text-anchor="start">数据泄漏往往发生在模型训练之前</text>
<rect x="35" y="74" width="931" height="123" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="56" y="107" font-size="20" fill="#bc6a47" font-weight="780" text-anchor="start">错误</text>
<rect x="168" y="97" width="181" height="69" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="183" y="122" font-size="17" fill="#203735" font-weight="700" text-anchor="start">全量数据</text><text x="183" y="148" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">含未来测试样本</text>
<path d="M353 132 H394" fill="none" stroke="#bc6a47" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="399" y="97" width="232" height="69" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="415" y="121" font-size="16" fill="#bc6a47" font-weight="700" text-anchor="start">先 fit_transform</text><text x="415" y="148" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">均值已经含测试信息</text>
<path d="M636 132 H677" fill="none" stroke="#bc6a47" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="682" y="97" width="247" height="69" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="698" y="123" font-size="16" fill="#203735" font-weight="700" text-anchor="start">再切训练 / 测试</text><text x="698" y="148" font-size="13" fill="#bc6a47" font-weight="500" text-anchor="start">评估可能偏乐观</text>
<rect x="35" y="218" width="931" height="131" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="56" y="254" font-size="20" fill="#16786f" font-weight="780" text-anchor="start">正确</text>
<rect x="168" y="240" width="181" height="76" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="183" y="265" font-size="16" fill="#203735" font-weight="700" text-anchor="start">原始数据 → 切分</text><text x="183" y="291" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">训练 / 验证 / 测试</text>
<path d="M353 278 H394" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="399" y="240" width="232" height="76" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="415" y="265" font-size="17" fill="#16786f" font-weight="720" text-anchor="start">仅训练集 fit</text><text x="415" y="290" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">学得均值 / 编码类别</text>
<path d="M636 278 H677" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="682" y="240" width="247" height="76" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="697" y="265" font-size="16" fill="#16786f" font-weight="720" text-anchor="start">对各集合 transform</text><text x="697" y="290" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">测试集只做最终评估</text>
<text x="37" y="376" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">交叉验证中也应将所有需要学习统计量的步骤放入 Pipeline。</text>
</g></svg>