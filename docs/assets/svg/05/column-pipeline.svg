<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">数值特征和类别特征的预处理管线</title><desc id="d">先拆分训练和测试。训练集两类列分别学习填充与缩放、填充与独热编码规则，再由列转换器拼接特征并训练模型。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="36" y="42" font-size="22" fill="#203735" font-weight="750" text-anchor="start">一份表格，不同列需要不同的变换</text>
<rect x="36" y="76" width="206" height="82" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="54" y="107" font-size="18" fill="#203735" font-weight="730" text-anchor="start">训练表 X_train</text><text x="54" y="133" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">数值列 + 类别列</text>
<path d="M242 117 H293 V199 H321" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><path d="M293 117 V285 H321" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="326" y="156" width="288" height="86" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="345" y="181" font-size="17" fill="#16786f" font-weight="750" text-anchor="start">数值列</text><text x="345" y="209" font-size="15" fill="#203735" font-weight="500" text-anchor="start">median impute → standardize</text>
<rect x="326" y="253" width="288" height="86" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="345" y="278" font-size="17" fill="#bc6a47" font-weight="750" text-anchor="start">类别列</text><text x="345" y="306" font-size="15" fill="#203735" font-weight="500" text-anchor="start">most frequent → one-hot</text>
<path d="M614 198 H663 V251 H680" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><path d="M614 295 H680 V251" fill="none" stroke="#bc6a47" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="685" y="206" width="270" height="88" rx="13" fill="#f0edf9" stroke="#d9e2dc"/><text x="703" y="239" font-size="18" fill="#7863b0" font-weight="750" text-anchor="start">ColumnTransformer</text><text x="703" y="264" font-size="15" fill="#203735" font-weight="500" text-anchor="start">合并为模型输入矩阵</text>
<rect x="42" y="271" width="238" height="76" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="61" y="300" font-size="16" fill="#203735" font-weight="720" text-anchor="start">X_test 单独 transform</text><text x="61" y="324" font-size="13" fill="#bc6a47" font-weight="500" text-anchor="start">不能重新 fit 填充器 / 编码器</text>
<text x="38" y="374" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">同一 Pipeline 内对交叉验证每一折分别拟合，避免跨折信息泄漏。</text>
</g></svg>