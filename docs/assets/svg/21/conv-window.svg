<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="cnn-conv-title cnn-conv-desc">
<title id="cnn-conv-title">卷积核在多通道图像上滑动并累加</title><desc id="cnn-conv-desc">3×3 卷积核覆盖输入局部区域；每个通道分别点乘后求和，再加偏置，形成输出特征图的一个位置。</desc>
