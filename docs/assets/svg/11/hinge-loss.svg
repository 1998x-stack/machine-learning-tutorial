<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">Hinge 损失相对于函数间隔的精确曲线</title><desc id="d">横轴为 y 乘 f(x)，纵轴为 max(0,1-y f(x))。间隔大于等于1时损失零，错误分类与边界内点有正损失。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597069" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="19" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" fill="#213b37" font-size="22" font-weight="750" text-anchor="start">Hinge loss：不仅要求分对，还要求留出安全间隔</text>
<rect x="35" y="80" width="640" height="321" rx="12" fill="#fff" stroke="#d8e2d9"/><path d="M108 364 V108 M108 364 H637" fill="none" stroke="#9bab9f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M102 356 H114" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="92" y="361" fill="#597069" font-size="13" font-weight="450" text-anchor="end">0</text><path d="M102 282 H114" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="92" y="287" fill="#597069" font-size="13" font-weight="450" text-anchor="end">1</text><path d="M102 208 H114" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="92" y="213" fill="#597069" font-size="13" font-weight="450" text-anchor="end">2</text><path d="M102 134 H114" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="92" y="139" fill="#597069" font-size="13" font-weight="450" text-anchor="end">3</text>
<path d="M134 356 V365" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="134" y="382" fill="#597069" font-size="13" font-weight="450" text-anchor="middle">-2</text><path d="M250 356 V365" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="250" y="382" fill="#597069" font-size="13" font-weight="450" text-anchor="middle">-1</text><path d="M366 356 V365" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="366" y="382" fill="#597069" font-size="13" font-weight="450" text-anchor="middle">0</text><path d="M482 356 V365" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="482" y="382" fill="#597069" font-size="13" font-weight="450" text-anchor="middle">1</text><path d="M598 356 V365" fill="none" stroke="#597069" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="598" y="382" fill="#597069" font-size="13" font-weight="450" text-anchor="middle">2</text>
<path d="M134 134 L482 356 H622" fill="none" stroke="#c4774b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M366 112 V358" fill="none" stroke="#715cb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M482 112 V358" fill="none" stroke="#147b70" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="210" y="126" fill="#213b37" font-size="15" font-weight="660" text-anchor="start">margin = y·f(x)</text><text x="492" y="345" fill="#147b70" font-size="14" font-weight="730" text-anchor="start">零损失</text>
<rect x="710" y="106" width="250" height="237" rx="12" fill="#eaf5ee" stroke="#d8e2d9"/><text x="730" y="139" fill="#147b70" font-size="18" font-weight="760" text-anchor="start">损失定义</text><text x="730" y="169" fill="#213b37" font-size="17" font-weight="680" text-anchor="start">L = max(0, 1 − yf(x))</text>
<text x="730" y="221" fill="#147b70" font-size="16" font-weight="750" text-anchor="start">yf(x) ≥ 1</text><text x="730" y="245" fill="#597069" font-size="14" font-weight="500" text-anchor="start">正确且在间隔外</text><text x="730" y="283" fill="#c4774b" font-size="16" font-weight="750" text-anchor="start">yf(x) &lt; 1</text><text x="730" y="309" fill="#597069" font-size="14" font-weight="500" text-anchor="start">有违例或被错分</text>
<text x="35" y="429" fill="#597069" font-size="14" font-weight="500" text-anchor="start">软间隔 C 控制违例惩罚与正则化的折中，不是直接指定“允许犯多少个错误”。</text>
</g></svg>