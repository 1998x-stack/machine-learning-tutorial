<rect x="701" y="105" width="262" height="246" rx="12" fill="#f1ecf8" stroke="#d8e2d9"/><text x="720" y="142" fill="#715cb0" font-size="20" font-weight="730" text-anchor="start">K(r)=exp(−γr²)</text><text x="720" y="188" fill="#213b37" font-size="16" font-weight="500" text-anchor="start">r = ||x−x'||</text><text x="720" y="220" fill="#213b37" font-size="16" font-weight="500" text-anchor="start">r=0 → K=1</text><text x="720" y="258" fill="#c4774b" font-size="15" font-weight="720" text-anchor="start">γ↑：相似度衰减更快</text><text x="720" y="303" fill="#597069" font-size="14" font-weight="500" text-anchor="start">先缩放特征，再搜索参数</text>
<text x="35" y="430" fill="#597069" font-size="14" font-weight="500" text-anchor="start">曲线由解析式计算；γ 必须与特征尺度共同理解。非线性核不等于显式生成一张无限维特征表。</text>
