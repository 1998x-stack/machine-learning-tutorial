<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">RBF 核在距离和 gamma 变化下的曲线</title><desc id="d">K(x,x')=exp(-gamma r^2)。gamma 为0.5下降缓慢、gamma为4下降迅速；r等于零时两者都为1。高 gamma 表示更局部的相似度。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597069" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="19" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="46" fill="#213b37" font-size="22" font-weight="760" text-anchor="start">RBF：高 γ 更局部，低 γ 更平滑</text>
