<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">SVM 的分类超平面、支持向量与两侧间隔</title><desc id="d">示意线性可分二分类，决策边界在 x 坐标 500，两侧规范化间隔在 400 与 600，位于间隔线上的样本是支持向量；正确间隔宽度为 2 除以权重范数。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597069" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="19" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" fill="#213b37" font-size="22" font-weight="750" text-anchor="start">最大间隔：在能分开的方向上留下最宽缓冲区</text>
<rect x="32" y="78" width="690" height="332" rx="12" fill="#fff" stroke="#d8e2d9"/><path d="M365 99 V389" fill="none" stroke="#c4774b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M465 99 V389" fill="none" stroke="#715cb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M565 99 V389" fill="none" stroke="#147b70" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/>
<circle cx="132" cy="148" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="184" cy="240" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="275" cy="163" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="338" cy="310" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="365" cy="209" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="220" cy="356" r="7" fill="#c4774b" stroke="white" stroke-width="2"/>
<circle cx="565" cy="249" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="625" cy="173" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="667" cy="276" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="595" cy="333" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="671" cy="128" r="7" fill="#147b70" stroke="white" stroke-width="2"/>
<text x="365" y="114" fill="#c4774b" font-size="14" font-weight="730" text-anchor="middle">−1</text><text x="465" y="114" fill="#715cb0" font-size="14" font-weight="730" text-anchor="middle">0</text><text x="565" y="114" fill="#147b70" font-size="14" font-weight="730" text-anchor="middle">+1</text>
<path d="M374 372 H456" fill="none" stroke="#597069" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M475 372 H557" fill="none" stroke="#597069" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="466" y="352" fill="#213b37" font-size="16" font-weight="700" text-anchor="middle">2 / ||w||</text>
<rect x="756" y="91" width="204" height="282" rx="12" fill="#f1ecf8" stroke="#d8e2d9"/><text x="774" y="122" fill="#715cb0" font-size="18" font-weight="720" text-anchor="start">边界</text><text x="774" y="151" fill="#213b37" font-size="17" font-weight="730" text-anchor="start">wᵀx + b = 0</text><text x="774" y="198" fill="#147b70" font-size="17" font-weight="700" text-anchor="start">两侧边界</text><text x="774" y="226" fill="#213b37" font-size="15" font-weight="500" text-anchor="start">wᵀx + b = ±1</text><text x="774" y="276" fill="#c4774b" font-size="17" font-weight="700" text-anchor="start">间隔宽度</text><text x="774" y="306" fill="#213b37" font-size="21" font-weight="780" text-anchor="start">2 / ||w||</text><text x="774" y="340" fill="#597069" font-size="13" font-weight="500" text-anchor="start">示意按比例绘制</text>
<text x="35" y="433" fill="#597069" font-size="14" font-weight="500" text-anchor="start">图中的颜色代表类别；位于边界最近处的样本决定间隔。现实数据也可能存在软间隔违例。</text>
</g></svg>