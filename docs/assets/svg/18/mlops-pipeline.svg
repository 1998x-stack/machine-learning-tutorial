<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">MLOps 将模型训练、验证、部署和监控连成可重复流程</title><desc id="desc">数据进入验证与特征处理，训练产出候选模型，独立验证与审批后登记版本，部署服务并持续监控数据和模型表现。监控信号触发重新评估，而不是无条件自动重训。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">从一次 Notebook 运行到可重复的模型交付</text><rect x="32" y="130" width="135" height="90" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="99" y="165" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">数据</text><text x="99" y="191" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">schema / quality</text><path d="M170 175 L208 175" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="212" y="130" width="145" height="90" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="284" y="165" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">特征处理</text><text x="284" y="191" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">fit / transform</text><path d="M360 175 L398 175" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="402" y="130" width="135" height="90" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="470" y="165" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="middle">训练</text><text x="470" y="191" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">candidate</text><path d="M540 175 L578 175" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="582" y="130" width="145" height="90" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="654" y="165" font-size="17" fill="#7863b0" font-weight="750" text-anchor="middle">验证 / 审批</text><text x="654" y="191" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">quality gates</text><path d="M730 175 L768 175" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="772" y="130" width="190" height="90" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="867" y="165" font-size="18" fill="#7863b0" font-weight="750" text-anchor="middle">模型注册表</text><text x="867" y="191" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">version / alias</text><path d="M865 222 L865 285" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="765" y="290" width="195" height="75" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="862" y="321" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">服务与监控</text><text x="862" y="344" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">latency / drift / quality</text><path d="M765 327 L625 327" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><path d="M625 327 L625 245" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><text x="610" y="307" font-size="13" fill="#bc6a47" font-weight="650" text-anchor="middle">反馈 / retrain trigger</text><text x="36" y="403" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">监控发现异常后先验证数据、标签延迟和业务变化，再决定回滚、告警或重训。</text></g></svg>