<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Feature Store 的离线历史检索与在线低延迟服务</title><desc id="desc">离线训练通过实体时间戳做 point-in-time join，只能取预测时刻之前已可用的特征值；在线推理从在线存储读取最新已物化值。共享定义不等于自动消除所有计算偏差。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6" marker-end="url(#arr)"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6" marker-end="url(#rev)"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">同一特征定义，服务两种时间语义</text><rect x="38" y="100" width="210" height="75" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="143" y="131" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">原始事件流</text><text x="143" y="155" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">entity · event_time · value</text><path d="M250 138 L320 138" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="325" y="100" width="225" height="75" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="437" y="131" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="middle">特征定义 / 物化</text><text x="437" y="155" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">schema · TTL · transform</text><path d="M552 138 L610 138" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M610 138 L610 110" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M610 138 L610 270" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="645" y="80" width="310" height="105" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="800" y="116" font-size="19" fill="#7863b0" font-weight="750" text-anchor="middle">Offline Store</text><text x="800" y="145" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">历史值 + point-in-time join</text><text x="800" y="168" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">用于训练数据集 / 回溯</text><rect x="645" y="250" width="310" height="105" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="800" y="286" font-size="19" fill="#147b70" font-weight="750" text-anchor="middle">Online Store</text><text x="800" y="315" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">最新可用物化值</text><text x="800" y="338" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">用于低延迟实时推理</text><path d="M550 138 L590 138" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M610 110 L645 130" fill="none" stroke="#7863b0" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M610 270 L645 302" fill="none" stroke="#147b70" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><text x="38" y="405" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">训练时不能把 event_time 之后才发生的事件 join 进来；online freshness 与 TTL 也必须监控。</text></g></svg>