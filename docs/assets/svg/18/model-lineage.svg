<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">实验运行、模型产物、注册版本与服务别名的谱系</title><desc id="desc">实验记录参数、指标、代码与输入数据版本；模型产物登记为不可变版本，别名指向当前被服务采用的版本。回滚应更新部署指针并保留完整审计记录。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">从实验运行追溯到线上版本</text><rect x="35" y="115" width="210" height="105" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="140" y="151" font-size="19" fill="#147b70" font-weight="750" text-anchor="middle">Experiment</text><text x="140" y="180" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">Run #41 · params / metrics</text><text x="140" y="200" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">code + data lineage</text><path d="M247 168 L310 168" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="315" y="115" width="190" height="105" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="410" y="151" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="middle">Model Artifact</text><text x="410" y="180" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">weights + signature</text><text x="410" y="200" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">environment</text><path d="M508 168 L570 168" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="575" y="115" width="190" height="105" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="670" y="151" font-size="19" fill="#7863b0" font-weight="750" text-anchor="middle">Registry v7</text><text x="670" y="180" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">immutable version</text><text x="670" y="200" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">review / approval</text><path d="M768 168 L830 168" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="835" y="115" width="130" height="105" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="900" y="151" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">champion</text><text x="900" y="180" font-size="14" fill="#52675f" font-weight="650" text-anchor="middle">alias → v7</text><path d="M900 222 L900 292" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="790" y="298" width="175" height="70" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="877" y="327" font-size="16" fill="#203a36" font-weight="700" text-anchor="middle">Serving endpoint</text><text x="877" y="350" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">model + schema</text><text x="36" y="410" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">别名不是模型内容本身；必须记录解析后的版本号、签名、依赖和部署配置。</text></g></svg>