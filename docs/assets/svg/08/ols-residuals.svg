<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">最小二乘法与竖直残差</title><desc id="desc">图中用人工构造的样本点及一条候选线说明每个竖直线段代表 y 与预测之差，平方误差优化拟合折中而非记忆每个点。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="43" font-size="22" fill="#203735" font-weight="760" text-anchor="start">用一条直线折中每个点的竖直误差</text>
<rect x="37" y="76" width="590" height="307" rx="12" fill="#fff" stroke="#d9e2db"/>
<path d="M88 342 V114 M88 342 H594" fill="none" stroke="#94a99e" stroke-width="2" stroke-linecap="round" />
<path d="M112 309 L564 132" fill="none" stroke="#147e70" stroke-width="3" stroke-linecap="round" />
<path d="M152 293.3 V260" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="152" cy="260" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M204 273.0 V280" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="204" cy="280" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M262 250.3 V201" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="262" cy="201" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M325 225.6 V230" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="325" cy="230" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M386 201.7 V179" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="386" cy="179" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M440 180.6 V149" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="440" cy="149" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M503 155.9 V170" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="503" cy="170" r="6" fill="#bd6945" stroke="white" stroke-width="2"/><path d="M549 137.9 V117" fill="none" stroke="#bd6945" stroke-width="2" stroke-linecap="round" /><circle cx="549" cy="117" r="6" fill="#bd6945" stroke="white" stroke-width="2"/>
<text x="139" y="113" font-size="18" fill="#147e70" font-weight="740" text-anchor="start">ŷ = β₀ + β₁x</text>
<text x="346" y="317" font-size="16" fill="#bd6945" font-weight="680" text-anchor="start">竖直距离 eᵢ = yᵢ − ŷᵢ</text>
<text x="102" y="371" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">特征 x →</text>
<rect x="662" y="103" width="295" height="247" rx="12" fill="#e7f5ed" stroke="#d9e2db"/><text x="681" y="136" font-size="19" fill="#147e70" font-weight="740" text-anchor="start">最小二乘的目标</text>
<text x="681" y="174" font-size="20" fill="#203735" font-weight="760" text-anchor="start">min Σ (yᵢ − ŷᵢ)²</text>
<text x="681" y="211" font-size="15" fill="#526b66" font-weight="500" text-anchor="start">正负误差不会抵消</text>
<text x="681" y="245" font-size="15" fill="#526b66" font-weight="500" text-anchor="start">大误差的代价更高</text>
<text x="681" y="286" font-size="15" fill="#bd6945" font-weight="690" text-anchor="start">拟合关联并非因果关系</text>
<text x="35" y="410" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">注意：图中的线只为解释残差，不能视作这些点经过 OLS 求出的精确最优线。</text>
</g></svg>