<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">正则化强度与 Ridge 和 Lasso 的概念性系数路径</title><desc id="desc">两组示意路径：随着正则强度增大，Ridge 系数一般朝零收缩，Lasso 某些系数可能变为零；特征相关时个别系数并非必然单调。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="43" font-size="22" fill="#203735" font-weight="760" text-anchor="start">正则化强度 α 越大，系数路径通常如何变化？</text>
<rect x="36" y="77" width="451" height="310" rx="12" fill="#fff" stroke="#d9e2db"/><text x="57" y="111" font-size="18" fill="#147e70" font-weight="720" text-anchor="start">L2：多数系数平滑接近零</text><path d="M84 332 V123 M84 332 H446" fill="none" stroke="#9eb0a7" stroke-width="1.7" stroke-linecap="round" /><path d="M90 137 C166 214 283 311 416 324" fill="none" stroke="#147e70" stroke-width="3.1" stroke-linecap="round" /><path d="M90 207 C181 257 304 316 416 326" fill="none" stroke="#bd6945" stroke-width="3.1" stroke-linecap="round" /><path d="M90 270 C187 297 304 324 416 328" fill="none" stroke="#795fb4" stroke-width="3.1" stroke-linecap="round" /><text x="86" y="366" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">弱正则</text><text x="359" y="366" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">强正则</text><rect x="515" y="77" width="451" height="310" rx="12" fill="#fff" stroke="#d9e2db"/><text x="536" y="111" font-size="18" fill="#bd6945" font-weight="720" text-anchor="start">L1：若干系数可能提前到零</text><path d="M563 332 V123 M563 332 H925" fill="none" stroke="#9eb0a7" stroke-width="1.7" stroke-linecap="round" /><path d="M569 137 C641 167 661 320 730 326" fill="none" stroke="#147e70" stroke-width="3.1" stroke-linecap="round" /><path d="M569 207 C643 238 665 326 695 326" fill="none" stroke="#bd6945" stroke-width="3.1" stroke-linecap="round" /><path d="M569 270 C617 287 634 326 665 326" fill="none" stroke="#795fb4" stroke-width="3.1" stroke-linecap="round" /><text x="565" y="366" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">弱正则</text><text x="838" y="366" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">强正则</text>
<text x="34" y="409" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">示意并非实测路径；相关特征、不同惩罚定义和特征尺度都会改变曲线。</text>
</g></svg>