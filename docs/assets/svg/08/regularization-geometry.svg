<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">L1 和 L2 约束形状与参数稀疏性</title><desc id="desc">二维系数空间中的 L2 可行域为圆，L1 可行域为菱形；菱形的角点使一些系数为零更常见，但不是必然。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="43" font-size="21" fill="#203735" font-weight="760" text-anchor="start">正则化改变“允许的参数空间”，不仅是数值惩罚</text>
<rect x="36" y="75" width="450" height="308" rx="12" fill="#fff" stroke="#d9e2db"/><text x="56" y="109" font-size="20" fill="#147e70" font-weight="730" text-anchor="start">L2 / Ridge：圆形</text><path d="M92 240 H419 M254 355 V121" fill="none" stroke="#a4b0a7" stroke-width="1.4" stroke-linecap="round" /><circle cx="254" cy="240" r="111" fill="#e7f5ed" stroke="#147e70" stroke-width="2.5"/><ellipse cx="371" cy="148" rx="173" ry="115" transform="rotate(-18 371 148)" fill="none" stroke="#795fb4" stroke-width="1.5" stroke-dasharray="6 7" opacity=".7"/><ellipse cx="371" cy="148" rx="142" ry="97" transform="rotate(-18 371 148)" fill="none" stroke="#795fb4" stroke-width="1.5" stroke-dasharray="6 7" opacity=".7"/><ellipse cx="371" cy="148" rx="115" ry="79" transform="rotate(-18 371 148)" fill="none" stroke="#795fb4" stroke-width="1.5" stroke-dasharray="6 7" opacity=".7"/><text x="58" y="357" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">圆滑边界通常促使平滑系数收缩</text><rect x="516" y="75" width="450" height="308" rx="12" fill="#fff" stroke="#d9e2db"/><text x="536" y="109" font-size="20" fill="#bd6945" font-weight="730" text-anchor="start">L1 / Lasso：菱形</text><path d="M572 240 H899 M734 355 V121" fill="none" stroke="#a4b0a7" stroke-width="1.4" stroke-linecap="round" /><path d="M734 141 L856 240 L734 339 L612 240 Z" fill="#faefe7" stroke="#bd6945" stroke-width="2.5"/><ellipse cx="851" cy="148" rx="173" ry="115" transform="rotate(-18 851 148)" fill="none" stroke="#795fb4" stroke-width="1.5" stroke-dasharray="6 7" opacity=".7"/><ellipse cx="851" cy="148" rx="142" ry="97" transform="rotate(-18 851 148)" fill="none" stroke="#795fb4" stroke-width="1.5" stroke-dasharray="6 7" opacity=".7"/><ellipse cx="851" cy="148" rx="115" ry="79" transform="rotate(-18 851 148)" fill="none" stroke="#795fb4" stroke-width="1.5" stroke-dasharray="6 7" opacity=".7"/><text x="538" y="357" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">角点更容易让个别系数恰为 0</text>
<text x="34" y="410" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">示意等高线与约束集合；实际最优点由数据、特征标准化和正则强度共同决定。</text>
</g></svg>