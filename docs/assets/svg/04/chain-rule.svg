<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">梯度链式法则的两条路径</title><desc id="d">前向图将输入与权重组合得到预测，再计算平方损失；反向传播从损失对预测的导数乘以预测对权重的导数得到梯度。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="38" y="42" font-size="22" fill="#203735" font-weight="750" text-anchor="start">梯度从哪里来：一层线性预测的链式法则</text>
<rect x="34" y="92" width="166" height="89" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="52" y="123" font-size="17" fill="#16786f" font-weight="700" text-anchor="start">输入 x、权重 w</text><text x="52" y="150" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">假设 x = 2</text>
<path d="M201 137 H249" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="253" y="92" width="203" height="89" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="274" y="121" font-size="18" fill="#bc6a47" font-weight="700" text-anchor="start">预测 ŷ = w·x</text><text x="274" y="151" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">当前 w = 1</text>
<path d="M457 137 H507" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="511" y="92" width="203" height="89" rx="13" fill="#f0edf9" stroke="#d9e2dc"/><text x="532" y="122" font-size="17" fill="#7863b0" font-weight="700" text-anchor="start">损失 (ŷ−y)²/2</text><text x="532" y="151" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">目标 y = 3</text>
<path d="M715 137 H770" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="774" y="92" width="179" height="89" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="794" y="122" font-size="17" fill="#16786f" font-weight="700" text-anchor="start">更新参数</text><text x="794" y="149" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">w ← w − ηg</text>
<path d="M611 184 V244 H353 V184" fill="none" stroke="#bc6a47" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="482" y="232" font-size="17" fill="#bc6a47" font-weight="750" text-anchor="middle">反向：dL/dw = (ŷ − y)·x</text>
<rect x="74" y="288" width="835" height="61" rx="13" fill="#f6f7f3" stroke="#d9e2dc"/><text x="95" y="315" font-size="17" fill="#203735" font-weight="700" text-anchor="start">代入：ŷ = 2，dL/dw = (2 − 3) × 2 = −2</text><text x="95" y="338" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">这是一个标量 toy example；多层网络沿同样链式规则连接局部导数。</text>
</g></svg>