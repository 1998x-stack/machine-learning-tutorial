<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">二次损失的梯度下降步长</title><desc id="d">对 f(w)=(w-3)平方，从 w0 等于零出发，学习率0.2逐步靠近三；学习率1.1导致步长过大并远离最小值。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="37" y="43" font-size="22" fill="#203735" font-weight="750" text-anchor="start">相同损失，不同学习率：沿着梯度反方向走</text>
<rect x="38" y="73" width="603" height="284" rx="13" fill="#fff" stroke="#d9e2dc"/>
<path d="M90 319 V89 M90 319 H604" fill="none" stroke="#91a79b" stroke-width="2" />
<path d="M116 105 Q356 535 601 103" fill="none" stroke="#516c67" stroke-width="3"/>
<circle cx="358" cy="319" r="6" fill="#7863b0"/><text x="373" y="317" font-size="14" fill="#7863b0" font-weight="750" text-anchor="start">w*=3</text>
<circle cx="128" cy="117" r="7" fill="#16786f"/><path d="M138 118 L210 205" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><circle cx="219" cy="210" r="7" fill="#16786f"/><path d="M229 211 L267 254" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><circle cx="276" cy="259" r="7" fill="#16786f"/><path d="M286 260 L300 279" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><circle cx="309" cy="284" r="7" fill="#16786f"/><path d="M319 285 L319 296" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><circle cx="328" cy="301" r="7" fill="#16786f"/><path d="M338 302 L330 305" fill="none" stroke="#16786f" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><circle cx="339" cy="310" r="7" fill="#16786f"/>
<text x="119" y="91" font-size="15" fill="#16786f" font-weight="700" text-anchor="start">w₀ = 0</text><text x="197" y="340" font-size="14" fill="#16786f" font-weight="700" text-anchor="start">η = 0.2：逐步收敛</text>
<rect x="676" y="100" width="283" height="231" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="699" y="139" font-size="19" fill="#bc6a47" font-weight="750" text-anchor="start">更新公式</text><text x="699" y="174" font-size="16" fill="#203735" font-weight="500" text-anchor="start">w' = w − η · 2(w − 3)</text><text x="699" y="211" font-size="14" fill="#16786f" font-weight="720" text-anchor="start">η = 0.2 → 0, 1.2, 1.92…</text><text x="699" y="245" font-size="14" fill="#bc6a47" font-weight="720" text-anchor="start">η = 1.1 → 0, 6.6, −1.32…</text><text x="699" y="285" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">较大的步长可能发散；</text><text x="699" y="308" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">不等于“走得更快”。</text>
</g></svg>