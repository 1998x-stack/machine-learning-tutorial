<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 265" role="img" aria-labelledby="map-title map-desc"><title id="map-title">机器学习从问题到交付的学习路线</title><desc id="map-desc">沿着五个阶段依次学习：定义问题、数学基础、数据与模型、评估和优化、部署与反馈。每个阶段连接下一个阶段，部署后的反馈回到问题定义。</desc><defs><marker id="map-arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#55756f" stroke-width="1.6"/></marker></defs><rect x="2" y="2" width="1076" height="261" rx="22" fill="#f9f7f2" stroke="#e5e3dd"/><g stroke="#9aac9f" stroke-width="2" fill="none" marker-end="url(#map-arr)"><path d="M192 119 H247"/><path d="M398 119 H453"/><path d="M604 119 H659"/><path d="M810 119 H865"/></g><path d="M980 183 C982 236 106 247 105 183" stroke="#d1a37b" stroke-width="2" stroke-dasharray="7 7" fill="none"/><text x="544" y="240" text-anchor="middle" font-size="13" fill="#8b735d">线上反馈与漂移监测持续影响问题定义</text><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><g><rect x="38" y="57" width="154" height="126" rx="16" fill="#e9f4ee" stroke="#ced8d1"/><text x="56" y="86" fill="#6c8078" font-size="13" font-weight="650">01</text><text x="56" y="119" fill="#1f3c3c" font-size="20" font-weight="700">定义问题</text><text x="56" y="145" fill="#486263" font-size="12.5">目标、切分、指标</text></g><g><rect x="244" y="57" width="154" height="126" rx="16" fill="#e6f0f2" stroke="#ced8d1"/><text x="262" y="86" fill="#6c8078" font-size="13" font-weight="650">02</text><text x="262" y="119" fill="#1f3c3c" font-size="20" font-weight="700">数学基础</text><text x="262" y="145" fill="#486263" font-size="12.5">向量、概率、梯度</text></g><g><rect x="450" y="57" width="154" height="126" rx="16" fill="#f9ede4" stroke="#ced8d1"/><text x="468" y="86" fill="#6c8078" font-size="13" font-weight="650">03</text><text x="468" y="119" fill="#1f3c3c" font-size="20" font-weight="700">数据与模型</text><text x="468" y="145" fill="#486263" font-size="12.5">预处理、训练、算法</text></g><g><rect x="656" y="57" width="154" height="126" rx="16" fill="#edeaf6" stroke="#ced8d1"/><text x="674" y="86" fill="#6c8078" font-size="13" font-weight="650">04</text><text x="674" y="119" fill="#1f3c3c" font-size="20" font-weight="700">评估与优化</text><text x="674" y="145" fill="#486263" font-size="12.5">验证、调参、解释</text></g><g><rect x="862" y="57" width="154" height="126" rx="16" fill="#e9f4ee" stroke="#ced8d1"/><text x="880" y="86" fill="#6c8078" font-size="13" font-weight="650">05</text><text x="880" y="119" fill="#1f3c3c" font-size="20" font-weight="700">交付与迭代</text><text x="880" y="145" fill="#486263" font-size="12.5">服务、监控、反馈</text></g></g></svg>