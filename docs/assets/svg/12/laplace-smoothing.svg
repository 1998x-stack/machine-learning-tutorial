<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">多项式朴素贝叶斯的加法平滑</title><desc id="d">三个词构成词表，spam 类总词数12且free计数6，ham总词数10且free计数1。alpha=1，free条件概率分别7/15和2/13，分母加 alpha乘词表大小。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597069" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="19" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="44" fill="#213b37" font-size="22" font-weight="760" text-anchor="start">从词频到概率：为什么零计数需要平滑？</text>
<rect x="37" y="93" width="585" height="270" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="57" y="125" fill="#597069" font-size="17" font-weight="700" text-anchor="start">类别</text><text x="226" y="125" fill="#597069" font-size="17" font-weight="700" text-anchor="start">总词数 N</text><text x="377" y="125" fill="#597069" font-size="17" font-weight="700" text-anchor="start">free 出现次数</text>
<path d="M53 137 H602" fill="none" stroke="#d8e2d9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="56" y="144" width="530" height="65" rx="8" fill="#eaf5ee" stroke="#d8e2d9"/><text x="72" y="173" fill="#147b70" font-size="20" font-weight="750" text-anchor="start">spam</text><text x="249" y="173" fill="#213b37" font-size="21" font-weight="750" text-anchor="start">12</text><text x="417" y="173" fill="#213b37" font-size="21" font-weight="750" text-anchor="start">6</text><rect x="56" y="222" width="530" height="65" rx="8" fill="#fff" stroke="#d8e2d9"/><text x="72" y="251" fill="#c4774b" font-size="20" font-weight="750" text-anchor="start">ham</text><text x="249" y="251" fill="#213b37" font-size="21" font-weight="750" text-anchor="start">10</text><text x="417" y="251" fill="#213b37" font-size="21" font-weight="750" text-anchor="start">1</text>
<text x="56" y="331" fill="#597069" font-size="16" font-weight="500" text-anchor="start">词表大小 |V| = 3；Laplace α = 1</text>
<rect x="657" y="101" width="304" height="250" rx="12" fill="#f1ecf8" stroke="#d8e2d9"/><text x="679" y="139" fill="#715cb0" font-size="19" font-weight="750" text-anchor="start">加法平滑</text><text x="679" y="182" fill="#213b37" font-size="16" font-weight="720" text-anchor="start">P(free | spam)</text><text x="679" y="209" fill="#147b70" font-size="17" font-weight="740" text-anchor="start">(6+1)/(12+3)=7/15</text><text x="679" y="253" fill="#213b37" font-size="16" font-weight="720" text-anchor="start">P(free | ham)</text><text x="679" y="282" fill="#c4774b" font-size="17" font-weight="740" text-anchor="start">(1+1)/(10+3)=2/13</text>
<text x="36" y="419" fill="#597069" font-size="14" font-weight="500" text-anchor="start">这里的 12 和 10 是词 token 的总计数，不是文档数；MultinomialNB 需要非负输入。</text>
</g></svg>