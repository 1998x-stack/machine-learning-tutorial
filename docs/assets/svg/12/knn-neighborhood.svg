<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">KNN 查询点与最近三个邻居</title><desc id="d">查询点在二维空间里，标出的三个最近邻中两个绿色类一个橙色类，因此 k=3、uniform weights 的预测是绿色类；请注意图的点位距离关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597069" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="19" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="45" fill="#213b37" font-size="22" font-weight="750" text-anchor="start">KNN：训练阶段记住数据，预测时才寻找邻居</text>
<rect x="35" y="79" width="617" height="313" rx="12" fill="#fff" stroke="#d8e2d9"/><path d="M95 350 V119 M95 350 H611" fill="none" stroke="#9cad9f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="340" cy="233" r="10" fill="#715cb0" stroke="white" stroke-width="2"/><text x="358" y="223" fill="#715cb0" font-size="16" font-weight="740" text-anchor="start">query</text>
<path d="M340 233 L296 202" fill="none" stroke="#715cb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="296" cy="202" r="8" fill="#147b70" stroke="white" stroke-width="2"/><path d="M340 233 L382 245" fill="none" stroke="#715cb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="382" cy="245" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><path d="M340 233 L329 283" fill="none" stroke="#715cb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="329" cy="283" r="8" fill="#147b70" stroke="white" stroke-width="2"/>
<circle cx="161" cy="145" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="215" cy="300" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="506" cy="146" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="553" cy="322" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="116" cy="269" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="469" cy="345" r="7" fill="#c4774b" stroke="white" stroke-width="2"/>
<text x="106" y="382" fill="#597069" font-size="13" font-weight="500" text-anchor="start">示意二维欧氏距离：以 query 为中心找最近 k=3 个样本</text>
<rect x="696" y="106" width="267" height="237" rx="12" fill="#eaf5ee" stroke="#d8e2d9"/><text x="716" y="139" fill="#147b70" font-size="19" font-weight="760" text-anchor="start">最近三个</text><text x="716" y="172" fill="#213b37" font-size="17" font-weight="720" text-anchor="start">绿色 2 · 橙色 1</text>
<text x="716" y="221" fill="#213b37" font-size="16" font-weight="500" text-anchor="start">uniform 投票</text><text x="716" y="252" fill="#147b70" font-size="20" font-weight="780" text-anchor="start">预测：绿色</text><text x="716" y="300" fill="#597069" font-size="14" font-weight="500" text-anchor="start">k 与距离度量需在 CV 选定</text>
<text x="34" y="427" fill="#597069" font-size="14" font-weight="500" text-anchor="start">距离对不同量纲敏感；标准化器必须只在训练折拟合。k 很小容易受噪声影响。</text>
</g></svg>