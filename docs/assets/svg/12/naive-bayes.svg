<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">朴素贝叶斯的后验分解</title><desc id="d">类别先验乘各维特征的类条件似然，并归一化。条件独立假设便于计算，但特征真实相关时结果仍可用于分类却可能校准较差。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597069" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="19" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" fill="#213b37" font-size="21" font-weight="750" text-anchor="start">朴素贝叶斯：把复杂联合概率拆成可估计的部分</text>
<rect x="38" y="96" width="196" height="89" rx="12" fill="#eaf5ee" stroke="#d8e2d9"/><text x="56" y="128" fill="#147b70" font-size="18" font-weight="750" text-anchor="start">类别先验</text><text x="56" y="156" fill="#213b37" font-size="18" font-weight="720" text-anchor="start">P(y=c)</text>
<path d="M235 140 H281" fill="none" stroke="#597069" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="286" y="92" width="273" height="98" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="305" y="124" fill="#c4774b" font-size="18" font-weight="740" text-anchor="start">每个特征的条件证据</text><text x="305" y="155" fill="#213b37" font-size="16" font-weight="500" text-anchor="start">P(x₁|c) × … × P(xd|c)</text>
<path d="M559 140 H598" fill="none" stroke="#597069" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="602" y="96" width="343" height="89" rx="12" fill="#f1ecf8" stroke="#d8e2d9"/><text x="619" y="128" fill="#715cb0" font-size="18" font-weight="730" text-anchor="start">合成类别分数</text><text x="619" y="158" fill="#213b37" font-size="15" font-weight="500" text-anchor="start">score(c) = prior × likelihoods</text>
<rect x="68" y="260" width="259" height="99" rx="12" fill="#eaf5ee" stroke="#d8e2d9"/><text x="84" y="294" fill="#147b70" font-size="18" font-weight="740" text-anchor="start">GaussianNB</text><text x="84" y="323" fill="#597069" font-size="14" font-weight="500" text-anchor="start">连续特征条件正态</text><rect x="376" y="260" width="259" height="99" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="392" y="294" fill="#c4774b" font-size="18" font-weight="740" text-anchor="start">MultinomialNB</text><text x="392" y="323" fill="#597069" font-size="14" font-weight="500" text-anchor="start">非负计数/词频</text><rect x="684" y="260" width="259" height="99" rx="12" fill="#f1ecf8" stroke="#d8e2d9"/><text x="700" y="294" fill="#715cb0" font-size="18" font-weight="740" text-anchor="start">BernoulliNB</text><text x="700" y="323" fill="#597069" font-size="14" font-weight="500" text-anchor="start">二值事件存在与否</text>
<text x="36" y="426" fill="#597069" font-size="14" font-weight="500" text-anchor="start">独立性是给定类别后的条件假设；它简化计算，不保证输出概率已校准。</text>
</g></svg>