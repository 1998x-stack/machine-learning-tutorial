<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="llm-agent-title llm-agent-desc"><title id="llm-agent-title">工具调用受策略、审批和沙箱约束</title><desc id="llm-agent-desc">模型给出结构化工具请求，受信任控制器校验权限/参数/预算，在需要时申请审批，再调用 allowlisted 工具并把输出标记为不可信数据。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="48" y="48" class="t">Agent：推理负责建议，控制器负责授权</text>
<rect x="60" y="130" width="178" height="102" rx="13" class="g"/><text x="149" y="160" text-anchor="middle" class="l">用户任务</text><text x="149" y="186" text-anchor="middle" class="s">身份与意图</text><path d="M238 180 L290 180" class="arrow"/>
<rect x="305" y="130" width="196" height="102" rx="13" class="p"/><text x="403" y="160" text-anchor="middle" class="l">LLM 规划</text><text x="403" y="186" text-anchor="middle" class="s">tool name + args</text><path d="M501 180 L550 180" class="arrow"/>
<rect x="566" y="115" width="222" height="130" rx="13" class="o"/><text x="677" y="145" text-anchor="middle" class="l">Policy Gate</text><text x="677" y="171" text-anchor="middle" class="s">ACL · schema · budget</text><text x="677" y="197" text-anchor="middle" class="s">风险操作先审批</text><path d="M788 180 L835 180" class="arrow"/>
<rect x="849" y="130" width="193" height="102" rx="13" class="g"/><text x="945.5" y="160" text-anchor="middle" class="l">允许的工具</text><text x="945.5" y="186" text-anchor="middle" class="s">只读 API / 搜索</text>
<path d="M943 232 V315 H390 V255" class="arrow dash"/>
<rect x="295" y="315" width="350" height="107" rx="13" class="n"/><text x="470" y="345" text-anchor="middle" class="l">输出进入上下文</text><text x="470" y="371" text-anchor="middle" class="s">视为不可信文本</text><text x="470" y="397" text-anchor="middle" class="s">不得覆盖系统策略</text>
<path d="M295 368 H230 V265" class="arrow dash"/>
<text x="50" y="487" class="s">失败处理：超时、重试上限、审计日志、幂等性和人工升级；“提示词说不要执行”不能代替工具权限。</text></svg>