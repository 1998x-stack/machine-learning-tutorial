ize:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">嵌入 + 位置</text><text x="286" y="172" font-size="11" fill="#c58a6f" text-anchor="middle" style=";fill:rgb(197, 138, 111);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:11px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">token → 向量</text><path d="M346 154 H378" fill="none" stroke="#57706c" stroke-width="1.6" marker-end="url(#ar26a)" style=";stroke:rgb(87, 112, 108);stroke-width:1.6px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><rect x="382" y="104" width="196" height="100" rx="8" fill="#efeaf7" stroke="#7863b0" style=";fill:rgb(239, 234, 247);stroke:rgb(120, 99, 176);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="480" y="140" font-size="13" fill="#66529e" text-anchor="middle" style=";fill:rgb(102, 82, 158);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">解码器层 × N</text><text x="480" y="162" font-size="11.5" fill="#8a7db5" text-anchor="middle" style=";fill:rgb(138, 125, 181);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:11.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">因果掩码自注意力</text><text x="480" y="182" font-size="11.5" fill="#8a7db5" text-anchor="middle" style=";fill:rgb(138, 125, 181);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:11.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">（只能看左侧）</text><path d="M578 154 H610" fill="none" stroke="#57706c" stroke-width="1.6" marker-end="url(#ar26a)" style=";stroke:rgb(87, 112, 108);stroke-width:1.6px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><rect x="614" y="122" width="120" height="64" rx="8" fill="#f7e9e2" stroke="#c4774b" style=";fill:rgb(247, 233, 226);stroke:rgb(196, 119, 75);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="674" y="152" font-size="13" fill="#b5673f" text-anchor="middle" style=";fill:rgb(181, 103, 63);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">线性投影</text><text x="674" y="172" font-size="11" fill="#c58a6f" text-anchor="middle" style=";fill:rgb(197, 138, 111);stroke-width:1px;stroke-linejoin:miter;stroke-li