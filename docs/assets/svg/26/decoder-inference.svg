<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="llm-decode-title llm-decode-desc"><title id="llm-decode-title">因果语言模型与 KV 缓存</title><desc id="llm-decode-desc">输入 tokenizer 生成 token IDs，嵌入与位置表示进入若干因果 self-attention 层产生 logits；每步采样一个新 token，并缓存已处理位置的 key/value 以减少重复计算。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="48" y="51" class="t">从 token 到下一 token：条件分布、缓存与迭代</text>
<rect x="50" y="125" width="180" height="90" rx="13" class="g"/><text x="140" y="155" text-anchor="middle" class="l">Token IDs</text><text x="140" y="181" text-anchor="middle" class="s">[B,T]</text>
<path d="M230 168 L287 168" class="arrow"/>
<rect x="300" y="125" width="190" height="90" rx="13" class="p"/><text x="395" y="155" text-anchor="middle" class="l">Embedding + Pos</text><text x="395" y="181" text-anchor="middle" class="s">[B,T,d]</text>
<path d="M490 168 L547 168" class="arrow"/>
<rect x="560" y="112" width="245" height="116" rx="13" class="o"/><text x="682.5" y="142" text-anchor="middle" class="l">Causal Decoder</text><text x="682.5" y="168" text-anchor="middle" class="s">masked self-attn + FFN</text><text x="682.5" y="194" text-anchor="middle" class="s">hidden [B,T,d]</text>
<path d="M805 168 L850 168" class="arrow"/>
<rect x="865" y="125" width="185" height="90" rx="13" class="g"/><text x="957.5" y="155" text-anchor="middle" class="l">Logits → softmax</text><text x="957.5" y="181" text-anchor="middle" class="s">[B,V]</text>
<rect x="565" y="290" width="240" height="96" rx="13" class="p"/><text x="685" y="320" text-anchor="middle" class="l">KV cache per layer</text><text x="685" y="346" text-anchor="middle" class="s">K,V: [B,H,T,dₕ]</text>
<path d="M690 228 V284" class="arrow"/><path d="M565 336 H458 V243 H550" class="arrow dash"/>
<text x="210" y="283" class="l">训练</text><text x="210" y="315" class="s">完整序列并行计算</text><text x="210" y="343" class="s">causal mask 防止看未来</text>
<text x="852" y="275" class="l">生成</text><text x="852" y="307" class="s">每次选择一个 token</text><text x="852" y="336" class="s">新 token 再送入模型</text>
<path d="M955 215 V445 H151 V221" class="warn dash"/>
<text x="550" y="476" class="s" text-anchor="middle">图中回路是自回归推理；KV cache 优化重复计算，不会让未来 token 同时生成。</text></svg>