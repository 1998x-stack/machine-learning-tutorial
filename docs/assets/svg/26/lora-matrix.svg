<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="llm-lora-title llm-lora-desc"><title id="llm-lora-title">LoRA 冻结原权重并学习低秩更新</title><desc id="llm-lora-desc">固定原权重 W0，训练 A∈R^(r×din)、B∈R^(dout×r)，将低秩增量 BA 乘以 alpha/r 加到原输出，参数从 dout×din 缩减到 r(din+dout)。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="48" y="48" class="t">LoRA：冻结完整矩阵，仅学习一个低秩增量</text>
<rect x="45" y="135" width="174" height="100" rx="13" class="g"/><text x="132" y="165" text-anchor="middle" class="l">输入 x</text><text x="132" y="191" text-anchor="middle" class="s">[B,dᵢₙ]</text>
<path d="M219 184 H277 V115 H330" class="arrow"/><path d="M277 184 V325 H330" class="arrow"/>
<rect x="345" y="78" width="270" height="100" rx="13" class="p"/><text x="480" y="108" text-anchor="middle" class="l">W₀（冻结）</text><text x="480" y="134" text-anchor="middle" class="s">[dₒᵤₜ,dᵢₙ]</text>
<rect x="345" y="278" width="137" height="100" rx="13" class="o"/><text x="413.5" y="308" text-anchor="middle" class="l">A（训练）</text><text x="413.5" y="334" text-anchor="middle" class="s">[r,dᵢₙ]</text><path d="M482 325 L518 325" class="arrow"/>
<rect x="535" y="278" width="137" height="100" rx="13" class="o"/><text x="603.5" y="308" text-anchor="middle" class="l">B（训练）</text><text x="603.5" y="334" text-anchor="middle" class="s">[dₒᵤₜ,r]</text>
<path d="M615 128 H743 V216 H779" class="arrow"/>
<path d="M672 330 H720 V236 H779" class="arrow"/>
<circle cx="804" cy="225" r="26" fill="#fff" stroke="#16786f" stroke-width="3"/><text x="804" y="232" text-anchor="middle" class="l">+</text>
<path d="M830 225 L884 225" class="arrow"/>
<rect x="900" y="177" width="150" height="95" rx="13" class="g"/><text x="975" y="207" text-anchor="middle" class="l">输出 y</text><text x="975" y="233" text-anchor="middle" class="s">[B,dₒᵤₜ]</text>
<text x="65" y="459" class="l">ΔW = (α/r)·BA</text><text x="390" y="459" class="s">参数数目：r(dᵢₙ+dₒᵤₜ)，不含 W₀</text><text x="65" y="501" class="s">低秩不保证所有任务无损；量化 LoRA、target modules、adapter 合并另有实现与精度约束。</text></svg>