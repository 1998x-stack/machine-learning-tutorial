<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="llm-rag-title llm-rag-desc"><title id="llm-rag-title">RAG 离线索引与在线问答双路径</title><desc id="llm-rag-desc">离线从授权文档切分生成嵌入和元数据索引；在线将查询嵌入并检索候选，按权限过滤/重排后附来源供生成器回答。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="48" y="48" class="t">知识不写死在权重里：离线索引与在线检索是两条不同路径</text>
<rect x="35" y="85" width="1025" height="145" rx="18" fill="#f3f7f1" stroke="#d6e2d7"/>
<text x="55" y="115" class="l">离线 / 持续更新</text>
<rect x="60" y="132" width="170" height="75" rx="13" class="g"/><text x="145" y="162" text-anchor="middle" class="l">文档与权限</text><text x="145" y="188" text-anchor="middle" class="s">版本/生效时间</text><path d="M230 168 L288 168" class="arrow"/>
<rect x="300" y="132" width="170" height="75" rx="13" class="n"/><text x="385" y="162" text-anchor="middle" class="l">清洗 · 分块</text><text x="385" y="188" text-anchor="middle" class="s">chunk ID</text><path d="M470 168 L528 168" class="arrow"/>
<rect x="540" y="132" width="180" height="75" rx="13" class="o"/><text x="630" y="162" text-anchor="middle" class="l">Embedding</text><text x="630" y="188" text-anchor="middle" class="s">向量 + 语义</text><path d="M720 168 L778 168" class="arrow"/>
<rect x="790" y="132" width="240" height="75" rx="13" class="p"/><text x="910" y="162" text-anchor="middle" class="l">索引 + ACL</text><text x="910" y="188" text-anchor="middle" class="s">向量/倒排/元数据</text>
<rect x="35" y="258" width="1025" height="211" rx="18" fill="#fdf7ef" stroke="#efdfc7"/>
<text x="55" y="292" class="l">在线 / 每个问题</text>
<rect x="60" y="320" width="145" height="87" rx="13" class="g"/><text x="132.5" y="350" text-anchor="middle" class="l">用户 Query</text><text x="132.5" y="376" text-anchor="middle" class="s">身份信息</text><path d="M205 365 L253 365" class="arrow"/>
<rect x="265" y="320" width="160" height="87" rx="13" class="o"/><text x="345" y="350" text-anchor="middle" class="l">查询嵌入</text><text x="345" y="376" text-anchor="middle" class="s">召回 candidates</text><path d="M425 365 L473 365" class="arrow"/>
<rect x="485" y="320" width="175" height="87" rx="13" class="p"/><text x="572.5" y="350" text-anchor="middle" class="l">ACL + Rerank</text><text x="572.5" y="376" text-anchor="middle" class="s">过滤 · 限额</text><path d="M660 365 L708 365" class="arrow"/>
<rect x="720" y="320" width="165" height="87" rx="13" class="o"/><text x="802.5" y="350" text-anchor="middle" class="l">上下文拼装</text><text x="802.5" y="376" text-anchor="middle" class="s">来源与引用</text><path d="M885 365 L921 365" class="arrow"/>
<rect x="932" y="320" width="106" height="87" rx="13" class="g"/><text x="985" y="350" text-anchor="middle" class="l">LLM</text><text x="985" y="376" text-anchor="middle" class="s">答案</text>
<path d="M911 208 V255 H572 V315" class="arrow dash"/>
<text x="52" y="506" class="s">关键边界：权限检查不能只靠 prompt；检索片段是数据，不是可信工具指令。无证据时允许拒答。</text></svg>