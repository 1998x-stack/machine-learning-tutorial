<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="ml-serving-title ml-serving-desc"><title id="ml-serving-title">训练和在线推理共用特征变换与模型工件</title><desc id="ml-serving-desc">训练路径固定列顺序、缺失值处理、类别词表、预处理与模型的版本，并将相同的推理管道用于 API；输入验证与授权属于服务层边界。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/>
<text x="46" y="48" class="t">“预测分数”依赖完整契约，而不是一个模型权重文件</text>
<text x="55" y="100" class="l">训练时（受控数据）</text>
<rect x="55" y="125" width="172" height="92" rx="13" class="g"/><text x="141" y="158" text-anchor="middle" class="l">训练快照</text><text x="141" y="186" text-anchor="middle" class="s">as-of features</text><path d="M227 169 L268 169" class="arrow"/>
<rect x="285" y="125" width="183" height="92" rx="13" class="p"/><text x="376.5" y="158" text-anchor="middle" class="l">Fit preprocessing</text><text x="376.5" y="186" text-anchor="middle" class="s">缺失/缩放/编码</text><path d="M468 169 L510 169" class="arrow"/>
<rect x="525" y="125" width="178" height="92" rx="13" class="o"/><text x="614" y="158" text-anchor="middle" class="l">Fit estimator</text><text x="614" y="186" text-anchor="middle" class="s">记录版本/阈值</text><path d="M703 169 L747 169" class="arrow"/>
<rect x="765" y="125" width="271" height="92" rx="13" class="g"/><text x="900.5" y="158" text-anchor="middle" class="l">发布产物</text><text x="900.5" y="186" text-anchor="middle" class="s">Pipeline + schema + hash</text>
<path d="M875 217 V265 H865 V295" class="arrow dash"/>
<text x="55" y="295" class="l">推理时（外部请求）</text>
<rect x="55" y="318" width="162" height="93" rx="13" class="g"/><text x="136" y="351" text-anchor="middle" class="l">HTTP 输入</text><text x="136" y="379" text-anchor="middle" class="s">身份和权限</text><path d="M217 363 L263 363" class="arrow"/>
<rect x="277" y="318" width="178" height="93" rx="13" class="p"/><text x="366" y="351" text-anchor="middle" class="l">Pydantic schema</text><text x="366" y="379" text-anchor="middle" class="s">字段/范围/有限值</text><path d="M455 363 L497 363" class="arrow"/>
<rect x="512" y="318" width="204" height="93" rx="13" class="o"/><text x="614" y="351" text-anchor="middle" class="l">Transform + Predict</text><text x="614" y="379" text-anchor="middle" class="s">同版本 Pipeline</text><path d="M716 363 L759 363" class="arrow"/>
<rect x="771" y="318" width="250" height="93" rx="13" class="g"/><text x="896" y="351" text-anchor="middle" class="l">预测输出</text><text x="896" y="379" text-anchor="middle" class="s">score + model version</text>
<path d="M865 295 V290 H618 V312" class="arrow dash"/>
<text x="55" y="492" class="s">训练/服务特征不一致会引入 skew；API 的参数范围校验不能代替数据来源与访问控制。</text></svg>