<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="ml-canary-title ml-canary-desc"><title id="ml-canary-title">金丝雀灰度与指标门禁</title><desc id="ml-canary-desc">部署路由示意 95% 请求给稳定版本 A、5% 给候选 B，监控 B 的错误、超时、漂移和带标签业务指标；异常触发回滚，放量要求统计与最低样本量。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/>
<text x="46" y="48" class="t">灰度发布是一个带回滚开关的实验，而不是“上线完成”</text>
<rect x="55" y="148" width="197" height="97" rx="13" class="g"/><text x="153.5" y="181" text-anchor="middle" class="l">用户请求</text><text x="153.5" y="209" text-anchor="middle" class="s">路由与身份</text>
<path d="M252 194 H318 V138 H374" class="arrow"/><path d="M318 194 V335 H374" class="arrow"/>
<rect x="389" y="99" width="240" height="107" rx="13" class="g"/><text x="509" y="132" text-anchor="middle" class="l">稳定版本 A</text><text x="509" y="160" text-anchor="middle" class="s">95%（流量示意）</text>
<rect x="389" y="290" width="240" height="107" rx="13" class="o"/><text x="509" y="323" text-anchor="middle" class="l">候选版本 B</text><text x="509" y="351" text-anchor="middle" class="s">5%（流量示意）</text>
<path d="M629 148 H719 V242 H778" class="arrow"/><path d="M629 339 H719 V278 H778" class="arrow"/>
<rect x="794" y="216" width="243" height="112" rx="13" class="p"/><text x="915.5" y="249" text-anchor="middle" class="l">指标 + 审计</text><text x="915.5" y="277" text-anchor="middle" class="s">错误/延迟/标签</text><text x="915.5" y="305" text-anchor="middle" class="s">时间窗和阈值</text>
<path d="M902 328 V437 H492 V402" class="warn dash"/>
<rect x="330" y="429" width="333" height="72" rx="12" class="y"/>
<text x="496" y="456" class="l" text-anchor="middle">发布门禁 / 回滚</text>
<text x="496" y="481" class="s" text-anchor="middle">自动化规则 + 人工审批</text>
<text x="53" y="527" class="xs">仅展示路由与控制关系。不能用短时间低样本的偶然波动证明模型更好。</text></svg>