<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="ml-monitor-title ml-monitor-desc"><title id="ml-monitor-title">数据漂移、概念漂移与性能监控的不同证据</title><desc id="ml-monitor-desc">无需标签即可发现输入/预测分布变化；有延迟标签后才能估算模型质量；数据漂移不自动意味着概念漂移或性能变差，应结合校准、切片和业务定义。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/>
<text x="46" y="48" class="t">线上监控需要三种时间尺度的证据</text>
<rect x="55" y="135" width="217" height="106" rx="13" class="g"/><text x="163.5" y="168" text-anchor="middle" class="l">实时流量</text><text x="163.5" y="196" text-anchor="middle" class="s">请求/响应/延迟</text>
<path d="M272 184 H346 V122 H395" class="arrow"/><path d="M346 184 V319 H395" class="arrow"/>
<rect x="410" y="82" width="250" height="108" rx="13" class="p"/><text x="535" y="115" text-anchor="middle" class="l">无标签监控</text><text x="535" y="143" text-anchor="middle" class="s">缺失率/输入漂移</text><text x="535" y="171" text-anchor="middle" class="s">分数分布/错误率</text>
<rect x="410" y="279" width="250" height="108" rx="13" class="o"/><text x="535" y="312" text-anchor="middle" class="l">延迟标签回流</text><text x="535" y="340" text-anchor="middle" class="s">按预测时间对齐</text><text x="535" y="368" text-anchor="middle" class="s">AUC / 校准 / 切片</text>
<path d="M660 134 H711 V215 H767" class="arrow"/><path d="M660 331 H711 V255 H767" class="arrow"/>
<rect x="784" y="196" width="250" height="115" rx="13" class="y"/><text x="909" y="229" text-anchor="middle" class="l">告警 → 复核</text><text x="909" y="257" text-anchor="middle" class="s">排除上游故障</text><text x="909" y="285" text-anchor="middle" class="s">验证后重训/回滚</text>
<line x1="55" y1="435" x2="1030" y2="435" stroke="#d4dfd8" stroke-width="2"/>
<text x="55" y="477" class="s">概念漂移指 P(y|x) 随时间变化；没有可靠标签时不能仅凭 PSI 或数据分布偏移确认概念漂移。</text></svg>