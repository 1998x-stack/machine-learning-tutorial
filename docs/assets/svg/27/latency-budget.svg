<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="ml-latency-title ml-latency-desc"><title id="ml-latency-title">服务端延迟预算及 p95 尾延迟</title><desc id="ml-latency-desc">示意请求 60ms 分为网络与解码 18ms、特征生成 7ms、模型推理 29ms、序列化 6ms；端到端用户体验还包含排队与网络。P95 不等于各组件 P95 之和。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/>
<text x="46" y="48" class="t">一次请求的端到端延迟：算力、排队与尾部都要量化</text>
<text x="52" y="100" class="l">示意请求总计 60 ms（非真实 benchmark）</text>
<rect x="60" y="130" width="258" height="110" rx="10" fill="#dff0e7" stroke="#16786f"/><text x="189" y="173" class="l" text-anchor="middle">网络 + 解析</text><text x="189" y="211" class="l" text-anchor="middle">18 ms</text>
<rect x="318" y="130" width="100" height="110" fill="#eee9f8" stroke="#7863b0"/><text x="368" y="173" class="s" text-anchor="middle">特征</text><text x="368" y="211" class="s" text-anchor="middle">7 ms</text>
<rect x="418" y="130" width="417" height="110" fill="#fbe8dc" stroke="#bc6a47"/><text x="626" y="173" class="l" text-anchor="middle">模型推理</text><text x="626" y="211" class="l" text-anchor="middle">29 ms</text>
<rect x="835" y="130" width="87" height="110" rx="4" fill="#f9f1dc" stroke="#a48138"/><text x="878" y="173" class="xs" text-anchor="middle">序列化</text><text x="878" y="211" class="s" text-anchor="middle">6 ms</text>
<rect x="60" y="293" width="355" height="112" rx="12" class="n"/><text x="88" y="327" class="l">P50</text><text x="88" y="358" class="s">50% 的请求不超过该值</text><text x="88" y="383" class="xs">中位数不能代表慢请求</text>
<rect x="451" y="293" width="425" height="112" rx="12" class="p"/><text x="480" y="327" class="l">P95 / P99</text><text x="480" y="358" class="s">从完整请求延迟样本分布估计</text><text x="480" y="383" class="xs">并发、排队、冷启动与高分位延迟</text>
<text x="60" y="475" class="s">吞吐量↑ 不保证 P99↓；增加 worker 也可能重复占用模型内存，应做负载测试。</text></svg>