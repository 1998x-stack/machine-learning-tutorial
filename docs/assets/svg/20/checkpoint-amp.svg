<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">可恢复训练需要模型和优化器状态，AMP 需要按设备管理精度</title><desc id="desc">模型 state_dict 保存参数与缓冲区，optimizer state_dict 保存动量等状态，训练进度和 scaler 状态用于恢复。CUDA float16 常用 autocast 与 GradScaler；CPU bfloat16 通常不需要 GradScaler。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">模型文件不是只有权重矩阵</text><rect x="35" y="105" width="270" height="250" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="60" y="143" font-size="19" fill="#203a36" font-weight="750" text-anchor="start">Checkpoint</text><rect x="60" y="170" width="220" height="42" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="170" y="197" font-size="15" fill="#147b70" font-weight="700" text-anchor="middle">model_state_dict</text><rect x="60" y="220" width="220" height="42" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="170" y="247" font-size="15" fill="#7863b0" font-weight="700" text-anchor="middle">optimizer_state_dict</text><rect x="60" y="270" width="220" height="42" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="170" y="297" font-size="15" fill="#bc6a47" font-weight="700" text-anchor="middle">epoch / scheduler</text><rect x="60" y="320" width="220" height="25" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="170" y="338" font-size="12" fill="#52675f" font-weight="600" text-anchor="middle">scaler / RNG (如需)</text><path d="M307 230 L375 230" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="380" y="105" width="260" height="250" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="510" y="143" font-size="19" fill="#203a36" font-weight="750" text-anchor="middle">Mixed precision</text><rect x="410" y="175" width="200" height="58" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="510" y="199" font-size="17" fill="#147b70" font-weight="700" text-anchor="middle">autocast</text><text x="510" y="219" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">选择算子精度</text><path d="M510 235 L510 265" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="410" y="270" width="200" height="58" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="510" y="294" font-size="17" fill="#bc6a47" font-weight="700" text-anchor="middle">GradScaler</text><text x="510" y="314" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">缩放 / 检查溢出</text><path d="M642 230 L710 230" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="715" y="145" width="250" height="165" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="840" y="185" font-size="19" fill="#7863b0" font-weight="750" text-anchor="middle">恢复训练</text><text x="840" y="222" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">重建模型与优化器</text><text x="840" y="250" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">加载所有 state_dict</text><text x="840" y="278" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">恢复 epoch 后继续</text><text x="36" y="408" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">CUDA AMP 使用 float16 时通常需要动态梯度缩放；bfloat16 的动态范围不同。</text></g></svg>