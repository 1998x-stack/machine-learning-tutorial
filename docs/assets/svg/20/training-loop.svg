<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">PyTorch 一个训练步依次清梯度、前向、算损失、反向和更新</title><desc id="desc">每个 mini-batch 首先清除上一轮累积梯度，然后计算预测与损失，backward 写入参数梯度，optimizer.step 更新参数。评估阶段切换 eval 并使用 inference_mode，不执行参数更新。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6" marker-end="url(#arr)"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6" marker-end="url(#rev)"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">训练步的五个动作必须保持正确顺序</text><rect x="40" y="145" width="165" height="100" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="122" y="181" font-size="17" fill="#147b70" font-weight="750" text-anchor="middle">1 · zero_grad</text><text x="122" y="211" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">清除旧梯度</text><path d="M207 195 L250 195" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="255" y="145" width="165" height="100" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="337" y="181" font-size="17" fill="#bc6a47" font-weight="750" text-anchor="middle">2 · forward</text><text x="337" y="211" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">计算 logits</text><path d="M422 195 L465 195" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="470" y="145" width="165" height="100" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="552" y="181" font-size="17" fill="#7863b0" font-weight="750" text-anchor="middle">3 · loss</text><text x="552" y="211" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">与目标比较</text><path d="M637 195 L680 195" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="685" y="145" width="125" height="100" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="747" y="181" font-size="16" fill="#bc6a47" font-weight="750" text-anchor="middle">4 · backward</text><text x="747" y="211" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">求梯度</text><path d="M812 195 L845 195" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="850" y="145" width="115" height="100" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="907" y="181" font-size="17" fill="#147b70" font-weight="750" text-anchor="middle">5 · step</text><text x="907" y="211" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">更新参数</text><path d="M907 250 L907 305" fill="none" stroke="#7863b0" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="700" y="310" width="265" height="65" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="832" y="337" font-size="15" fill="#7863b0" font-weight="700" text-anchor="middle">评估：eval() + inference_mode()</text><text x="832" y="359" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">只前向，不反传、不更新</text><text x="36" y="411" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">model.eval() 不等于关闭 autograd；inference_mode() 才关闭该上下文中的梯度记录。</text></g></svg>