<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">DataLoader 将样本索引、并行读取与 collate 组织成批次</title><desc id="desc">Map-style Dataset 通过索引读取单个样本，Sampler 决定索引顺序，worker 可并行读取，collate_fn 将样本列表组装为 batch，最后送到模型。IterableDataset 的分发语义不同。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6" marker-end="url(#arr)"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6" marker-end="url(#rev)"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">从单条样本到 mini-batch</text><rect x="35" y="145" width="155" height="95" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="112" y="180" font-size="18" fill="#147b70" font-weight="750" text-anchor="middle">Dataset</text><text x="112" y="207" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">__getitem__(i)</text><path d="M192 193 L245 193" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="250" y="145" width="145" height="95" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="322" y="180" font-size="18" fill="#7863b0" font-weight="750" text-anchor="middle">Sampler</text><text x="322" y="207" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">index order</text><path d="M397 193 L445 193" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="450" y="95" width="155" height="65" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="527" y="122" font-size="16" fill="#bc6a47" font-weight="700" text-anchor="middle">Worker 0</text><text x="527" y="143" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">load sample</text><rect x="450" y="180" width="155" height="65" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="527" y="207" font-size="16" fill="#bc6a47" font-weight="700" text-anchor="middle">Worker 1</text><text x="527" y="228" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">load sample</text><rect x="450" y="265" width="155" height="65" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="527" y="292" font-size="16" fill="#bc6a47" font-weight="700" text-anchor="middle">Worker n</text><text x="527" y="313" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">load sample</text><path d="M607 128 L665 212" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M607 213 L665 213" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><path d="M607 298 L665 213" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="670" y="170" width="145" height="90" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="742" y="205" font-size="17" fill="#147b70" font-weight="750" text-anchor="middle">collate_fn</text><text x="742" y="231" font-size="13" fill="#52675f" font-weight="500" text-anchor="middle">stack / pad</text><path d="M817 215 L865 215" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="870" y="170" width="100" height="90" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="920" y="205" font-size="17" fill="#7863b0" font-weight="750" text-anchor="middle">Batch</text><text x="920" y="231" font-size="14" fill="#52675f" font-weight="600" text-anchor="middle">B × …</text><text x="36" y="402" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">num_workers=0 便于调试；pin_memory 与 non_blocking 仅在设备传输条件合适时使用。</text></g></svg>