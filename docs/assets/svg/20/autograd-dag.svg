<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">PyTorch Autograd 在前向时记录动态图并沿反向依赖计算梯度</title><desc id="desc">x 与 w 是叶子张量，乘法和加法产生中间张量 z，loss 是标量根节点。backward 从根沿计算图反向应用链式法则，将梯度累积到需要梯度的叶子张量。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">前向执行时记录 DAG，backward 沿图反向</text><rect x="70" y="115" width="160" height="75" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="150" y="145" font-size="17" fill="#147b70" font-weight="750" text-anchor="middle">x (leaf)</text><text x="150" y="170" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">requires_grad</text><rect x="70" y="260" width="160" height="75" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="150" y="290" font-size="17" fill="#147b70" font-weight="750" text-anchor="middle">w (leaf)</text><text x="150" y="315" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">requires_grad</text><rect x="365" y="185" width="170" height="80" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="450" y="218" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="middle">z = x · w</text><text x="450" y="244" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">MulBackward</text><rect x="670" y="185" width="180" height="80" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="760" y="218" font-size="18" fill="#7863b0" font-weight="750" text-anchor="middle">loss = z²</text><text x="760" y="244" font-size="12" fill="#52675f" font-weight="500" text-anchor="middle">PowBackward</text><path d="M232 152 L360 210" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><path d="M232 297 L360 245" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><path d="M538 225 L665 225" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><path d="M760 270 L760 340" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><path d="M760 340 L450 340" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><path d="M450 340 L450 270" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><path d="M450 340 L150 340" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><path d="M150 340 L150 340" fill="none" stroke="#bc6a47" stroke-width="2" stroke-linecap="round"/><text x="760" y="370" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">backward()</text><text x="36" y="408" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">梯度默认累积到 .grad；每个训练步需 zero_grad，动态图通常每次 forward 重建。</text></g></svg>