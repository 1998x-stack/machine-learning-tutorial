<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">分类阈值移动会改变 Precision 与 Recall</title><desc id="desc">示意性 PR 轨迹：阈值降低通常会纳入更多正类预测，召回率不减，而精确率可能下降也可能局部波动。曲线是概念示意，不是实验数据。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">阈值不是模型参数的替代品，而是决策规则</text><path d="M105 350 L885 350" fill="none" stroke="#657a72" stroke-width="2" stroke-linecap="round"/><path d="M105 350 L105 95" fill="none" stroke="#657a72" stroke-width="2" stroke-linecap="round"/><text x="490" y="391" font-size="15" fill="#53675f" font-weight="650" text-anchor="middle">Recall  →</text><text x="45" y="105" font-size="14" fill="#53675f" font-weight="650" text-anchor="start">Precision</text><text x="85" y="365" font-size="12" fill="#6a7b73" font-weight="500" text-anchor="start">0</text><text x="85" y="100" font-size="12" fill="#6a7b73" font-weight="500" text-anchor="start">1</text><text x="100" y="372" font-size="12" fill="#6a7b73" font-weight="500" text-anchor="start">0</text><text x="868" y="372" font-size="12" fill="#6a7b73" font-weight="500" text-anchor="start">1</text><path d="M105 350 L885 350" fill="none" stroke="#d6dfd8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6"/><path d="M105 95 L105 350" fill="none" stroke="#d6dfd8" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6"/><path d="M130 112 C220 118 270 143 355 165 S520 216 610 240 S760 285 860 312" fill="none" stroke="#147b70" stroke-width="4" stroke-linecap="round"/><circle cx="180" cy="122" r="8" fill="#bc6a47" stroke="white" stroke-width="2"/><circle cx="520" cy="211" r="8" fill="#bc6a47" stroke="white" stroke-width="2"/><circle cx="820" cy="300" r="8" fill="#bc6a47" stroke="white" stroke-width="2"/><text x="180" y="94" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">高阈值</text><text x="520" y="184" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">中阈值</text><text x="820" y="273" font-size="14" fill="#bc6a47" font-weight="700" text-anchor="middle">低阈值</text><rect x="610" y="82" width="315" height="100" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="630" y="117" font-size="16" fill="#203a36" font-weight="700" text-anchor="start">阈值降低</text><text x="630" y="146" font-size="14" fill="#53675f" font-weight="500" text-anchor="start">更多样本被判为正类</text><text x="630" y="168" font-size="13" fill="#bc6a47" font-weight="650" text-anchor="start">Recall 往往上升，Precision 需实测</text><text x="36" y="423" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">PR 曲线依赖数据集的正类比例；阈值应在独立验证数据上按业务成本选择。</text></g></svg>