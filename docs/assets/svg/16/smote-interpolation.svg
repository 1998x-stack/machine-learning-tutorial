<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">SMOTE 在少数类近邻之间插值生成样本</title><desc id="desc">在少数类样本 x_i 与其一个少数类近邻 x_nn 之间，按随机比例 lambda 生成 x_new = x_i + lambda(x_nn - x_i)。图中只展示几何插值，不表示合成点一定符合真实数据分布。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">从少数类局部邻域生成合成样本</text><path d="M80 350 L920 350" fill="none" stroke="#9aa9a1" stroke-width="1.5" stroke-linecap="round"/><path d="M110 95 L110 365" fill="none" stroke="#9aa9a1" stroke-width="1.5" stroke-linecap="round"/><text x="900" y="377" font-size="13" fill="#6a7b73" font-weight="500" text-anchor="end">特征 1</text><text x="76" y="101" font-size="13" fill="#6a7b73" font-weight="500" text-anchor="start">特征 2</text><circle cx="270" cy="265" r="10" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="650" cy="125" r="10" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="465" cy="195" r="9" fill="#bc6a47" stroke="white" stroke-width="2"/><path d="M270 265 L650 125" fill="none" stroke="#147b70" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><circle cx="403" cy="216" r="11" fill="#bc6a47" stroke="white" stroke-width="2"/><path d="M270 265 L403 216" fill="none" stroke="#bc6a47" stroke-width="2.5" stroke-linecap="round"/><text x="245" y="296" font-size="17" fill="#147b70" font-weight="700" text-anchor="start">xᵢ</text><text x="665" y="123" font-size="17" fill="#147b70" font-weight="700" text-anchor="start">x_nn</text><text x="420" y="249" font-size="17" fill="#bc6a47" font-weight="700" text-anchor="start">x_new</text><text x="420" y="172" font-size="15" fill="#bc6a47" font-weight="650" text-anchor="start">λ = 0.35</text><text x="270" y="319" font-size="13" fill="#5a6e66" font-weight="500" text-anchor="start">少数类样本 A</text><text x="650" y="98" font-size="13" fill="#5a6e66" font-weight="500" text-anchor="start">少数类近邻 B</text><circle cx="180" cy="145" r="7" fill="#d5d9d4" stroke="white" stroke-width="2"/><circle cx="220" cy="115" r="7" fill="#d5d9d4" stroke="white" stroke-width="2"/><circle cx="740" cy="260" r="7" fill="#d5d9d4" stroke="white" stroke-width="2"/><circle cx="790" cy="290" r="7" fill="#d5d9d4" stroke="white" stroke-width="2"/><text x="740" y="322" font-size="13" fill="#87928a" font-weight="500" text-anchor="start">多数类点</text><rect x="725" y="75" width="230" height="115" rx="12" fill="#f5f7f3" stroke="#d8e2d9"/><text x="745" y="110" font-size="15" fill="#304442" font-weight="650" text-anchor="start">x_new = xᵢ + λ(x_nn − xᵢ)</text><text x="745" y="142" font-size="15" fill="#147b70" font-weight="650" text-anchor="start">λ ∈ [0, 1]</text><text x="36" y="411" font-size="15" fill="#52675f" font-weight="550" text-anchor="start">SMOTE 只在训练折内部 fit_resample；验证集与测试集保持原始类别比例。</text></g></svg>