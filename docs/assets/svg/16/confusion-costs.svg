<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">类别不平衡下的混淆矩阵与准确率陷阱</title><desc id="desc">一千条样本中只有十条正类。模型找到六条正类、漏掉四条，同时把四十条负类误报为正类，九百五十条负类识别正确。准确率仍为 95.6%，但精确率只有 13.0%，召回率为 60%。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">1,000 条样本：正类仅占 1%</text><text x="36" y="79" font-size="14" fill="#6a7b73" font-weight="650" text-anchor="start">真实标签</text><text x="490" y="79" font-size="15" fill="#6a7b73" font-weight="650" text-anchor="middle">预测负类</text><text x="790" y="79" font-size="15" fill="#6a7b73" font-weight="650" text-anchor="middle">预测正类</text><rect x="160" y="100" width="300" height="115" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><rect x="460" y="100" width="300" height="115" rx="12" fill="#f8eee8" stroke="#d8e2d9"/><rect x="160" y="215" width="300" height="115" rx="12" fill="#f3eff9" stroke="#d8e2d9"/><rect x="460" y="215" width="300" height="115" rx="12" fill="#e7f4f1" stroke="#d8e2d9"/><text x="36" y="158" font-size="17" fill="#304442" font-weight="700" text-anchor="start">真实负类</text><text x="36" y="272" font-size="17" fill="#304442" font-weight="700" text-anchor="start">真实正类</text><text x="310" y="149" font-size="25" fill="#147b70" font-weight="750" text-anchor="middle">TN = 950</text><text x="610" y="149" font-size="25" fill="#b56a49" font-weight="750" text-anchor="middle">FP = 40</text><text x="310" y="264" font-size="25" fill="#7863b0" font-weight="750" text-anchor="middle">FN = 4</text><text x="610" y="264" font-size="25" fill="#147b70" font-weight="750" text-anchor="middle">TP = 6</text><text x="310" y="188" font-size="13" fill="#5b6f68" font-weight="500" text-anchor="middle">正确拒绝</text><text x="610" y="188" font-size="13" fill="#5b6f68" font-weight="500" text-anchor="middle">误报</text><text x="310" y="302" font-size="13" fill="#5b6f68" font-weight="500" text-anchor="middle">漏检</text><text x="610" y="302" font-size="13" fill="#5b6f68" font-weight="500" text-anchor="middle">命中</text><path d="M790 118 L790 315" fill="none" stroke="#d8e2d9" stroke-width="1" stroke-linecap="round"/><text x="825" y="135" font-size="15" fill="#66766f" font-weight="650" text-anchor="start">Accuracy</text><text x="825" y="165" font-size="26" fill="#203a36" font-weight="750" text-anchor="start">95.6%</text><text x="825" y="220" font-size="15" fill="#66766f" font-weight="650" text-anchor="start">Precision</text><text x="825" y="250" font-size="26" fill="#bc6a47" font-weight="750" text-anchor="start">13.0%</text><text x="825" y="305" font-size="15" fill="#66766f" font-weight="650" text-anchor="start">Recall</text><text x="825" y="335" font-size="26" fill="#7863b0" font-weight="750" text-anchor="start">60.0%</text><text x="36" y="390" font-size="15" fill="#52675f" font-weight="550" text-anchor="start">同一组预测：Accuracy = (950 + 6) / 1,000；Precision = 6 / 46；Recall = 6 / 10</text></g></svg>