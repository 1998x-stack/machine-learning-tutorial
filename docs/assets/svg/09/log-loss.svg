<text x="96" y="367" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">p ≈ 0</text><text x="558" y="367" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">p ≈ 1</text>
<rect x="680" y="116" width="279" height="222" rx="12" fill="#efebfa" stroke="#d9e2db"/><text x="698" y="149" font-size="18" fill="#795fb4" font-weight="740" text-anchor="start">单样本二分类损失</text>
<text x="698" y="193" font-size="18" fill="#203735" font-weight="700" text-anchor="start">L = −y log(p)</text><text x="722" y="220" font-size="17" fill="#203735" font-weight="700" text-anchor="start">−(1−y)log(1−p)</text>
<text x="698" y="267" font-size="15" fill="#526b66" font-weight="500" text-anchor="start">若真实 y=1：</text><text x="698" y="296" font-size="15" fill="#bd6945" font-weight="710" text-anchor="start">p→0 时损失趋于无穷</text>
<text x="34" y="409" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">该图用精确函数绘制并对纵轴截断；没有把损失值当作模型实际训练曲线。</text>
</g></svg>