<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Sigmoid 从 logit 到概率</title><desc id="desc">线性打分 z 在实数域变化，经 sigmoid 映射到 0 到 1，z 为零对应概率 0.5。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="33" y="43" font-size="22" fill="#203735" font-weight="760" text-anchor="start">线性决策面上，Sigmoid 给出一个条件概率模型</text>
