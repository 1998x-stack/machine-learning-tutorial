<text x="102" y="371" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">z = −6</text><text x="571" y="371" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">z = +6</text>
<rect x="688" y="106" width="271" height="246" rx="12" fill="#e7f5ed" stroke="#d9e2db"/><text x="708" y="142" font-size="19" fill="#147e70" font-weight="740" text-anchor="start">p = 1/(1+exp(−z))</text>
<text x="708" y="187" font-size="17" fill="#203735" font-weight="710" text-anchor="start">z = wᵀx + b</text><text x="708" y="223" font-size="15" fill="#526b66" font-weight="500" text-anchor="start">z 增大时 p 单调增大</text><text x="708" y="257" font-size="15" fill="#526b66" font-weight="500" text-anchor="start">p 不是分类阈值本身</text><text x="708" y="289" font-size="15" fill="#bd6945" font-weight="700" text-anchor="start">阈值可针对业务另设</text>
<text x="34" y="414" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">逻辑回归的名称来自 log-odds 的线性性；“预测概率”也需要验证校准。</text>
