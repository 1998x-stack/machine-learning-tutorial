<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">区分排序分数、决策阈值和概率校准</title><desc id="desc">先根据模型输出分数排序，再用业务损失在验证集选择阈值，最后检查概率校准；ROC AUC 排序能力和校准不同。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="44" font-size="22" fill="#203735" font-weight="760" text-anchor="start">三个容易被混用的问题：排序、决策、校准</text>
<rect x="34" y="90" width="310" height="288" rx="12" fill="#fff" stroke="#d9e2db"/><rect x="50" y="108" width="278" height="55" rx="12" fill="#e7f5ed" stroke="#d9e2db"/><text x="63" y="143" font-size="19" fill="#147e70" font-weight="730" text-anchor="start">01 排序能力</text><text x="58" y="204" font-size="15" fill="#203735" font-weight="500" text-anchor="start">把真实正例排在负例前</text><text x="58" y="233" font-size="15" fill="#203735" font-weight="500" text-anchor="start">ROC AUC / AP</text><path d="M58 252 H316" fill="none" stroke="#d9e2db" stroke-width="1.5" stroke-linecap="round" /><text x="58" y="285" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">无需固定阈值</text><text x="58" y="317" font-size="14" fill="#147e70" font-weight="680" text-anchor="start">不说明概率精度</text><rect x="360" y="90" width="310" height="288" rx="12" fill="#fff" stroke="#d9e2db"/><rect x="376" y="108" width="278" height="55" rx="12" fill="#faefe7" stroke="#d9e2db"/><text x="389" y="143" font-size="19" fill="#bd6945" font-weight="730" text-anchor="start">02 业务决策</text><text x="384" y="204" font-size="15" fill="#203735" font-weight="500" text-anchor="start">选择报警或通过阈值</text><text x="384" y="233" font-size="15" fill="#203735" font-weight="500" text-anchor="start">Precision / Recall / Cost</text><path d="M384 252 H642" fill="none" stroke="#d9e2db" stroke-width="1.5" stroke-linecap="round" /><text x="384" y="285" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">阈值在验证集确定</text><text x="384" y="317" font-size="14" fill="#bd6945" font-weight="680" text-anchor="start">不改变已训练的打分</text><rect x="686" y="90" width="310" height="288" rx="12" fill="#fff" stroke="#d9e2db"/><rect x="702" y="108" width="278" height="55" rx="12" fill="#efebfa" stroke="#d9e2db"/><text x="715" y="143" font-size="19" fill="#795fb4" font-weight="730" text-anchor="start">03 概率校准</text><text x="710" y="204" font-size="15" fill="#203735" font-weight="500" text-anchor="start">在 p≈0.8 的样本中</text><text x="710" y="233" font-size="15" fill="#203735" font-weight="500" text-anchor="start">是否真的约 80% 为正？</text><path d="M710 252 H968" fill="none" stroke="#d9e2db" stroke-width="1.5" stroke-linecap="round" /><text x="710" y="285" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">另需校准评估与数据</text><text x="710" y="317" font-size="14" fill="#795fb4" font-weight="680" text-anchor="start">不等于阈值优化</text>
<text x="34" y="412" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">不能在测试集上调阈值或校准参数；排序能力强也不意味着预测概率就已校准。</text>
</g></svg>