<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="s-title s-desc"><title id="s-title">混淆矩阵与不平衡分类的三项指标</title><desc id="s-desc">100 人中真实阳性十个，TP8、FN2、FP12、TN78，因此准确率86%、精确率40%、召回率80%。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58716d" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d7e2da"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="33" y="43" font-size="22" fill="#203735" font-weight="760" text-anchor="start">准确率 86% 的模型，精确率为什么只有 40%？</text>
<text x="310" y="102" font-size="17" fill="#13796b" font-weight="750" text-anchor="middle">预测正</text><text x="527" y="102" font-size="17" fill="#58716d" font-weight="750" text-anchor="middle">预测负</text>
<text x="85" y="185" font-size="17" fill="#58716d" font-weight="700" text-anchor="start">真实正</text><text x="85" y="292" font-size="17" fill="#58716d" font-weight="700" text-anchor="start">真实负</text>
<rect x="214" y="121" width="202" height="94" rx="13" fill="#e8f4ee" stroke="#d7e2da"/><text x="232" y="160" font-size="26" fill="#13796b" font-weight="750" text-anchor="start">TP = 8</text><text x="232" y="191" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">正确检出</text><rect x="434" y="121" width="202" height="94" rx="13" fill="#faefe7" stroke="#d7e2da"/><text x="452" y="160" font-size="26" fill="#bb6842" font-weight="750" text-anchor="start">FN = 2</text><text x="452" y="191" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">漏报</text><rect x="214" y="229" width="202" height="94" rx="13" fill="#faefe7" stroke="#d7e2da"/><text x="232" y="268" font-size="26" fill="#bb6842" font-weight="750" text-anchor="start">FP = 12</text><text x="232" y="299" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">误报</text><rect x="434" y="229" width="202" height="94" rx="13" fill="#e8f4ee" stroke="#d7e2da"/><text x="452" y="268" font-size="26" fill="#13796b" font-weight="750" text-anchor="start">TN = 78</text><text x="452" y="299" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">正确排除</text>
<rect x="685" y="123" width="274" height="240" rx="13" fill="#eeeaf7" stroke="#d7e2da"/><text x="702" y="153" font-size="16" fill="#7760b1" font-weight="690" text-anchor="start">Accuracy</text><text x="702" y="181" font-size="20" fill="#203735" font-weight="760" text-anchor="start">(8+78)/100 = 86%</text><text x="702" y="225" font-size="16" fill="#7760b1" font-weight="690" text-anchor="start">Precision</text><text x="702" y="250" font-size="20" fill="#203735" font-weight="760" text-anchor="start">8/(8+12) = 40%</text><text x="702" y="293" font-size="16" fill="#7760b1" font-weight="690" text-anchor="start">Recall</text><text x="702" y="320" font-size="20" fill="#203735" font-weight="760" text-anchor="start">8/(8+2) = 80%</text>
<text x="35" y="410" font-size="14" fill="#58716d" font-weight="500" text-anchor="start">先明确正类和错误成本；ROC、PR、F1 与阈值选择回答的是不同的问题。</text>
</g></svg>