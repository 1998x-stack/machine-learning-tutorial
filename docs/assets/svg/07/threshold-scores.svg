<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="s-title s-desc"><title id="s-title">分类阈值将连续分数变为预测标签</title><desc id="s-desc">八个示例分数真实标签各不相同，阈值零点五时二个真阳性、二个假阳性、一个假阴性、三个真阴性。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#58716d" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d7e2da"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="43" font-size="22" fill="#203735" font-weight="750" text-anchor="start">阈值改变正类数量，却没有改变原始排序</text>
<text x="70" y="96" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">低分</text><text x="879" y="96" font-size="15" fill="#58716d" font-weight="500" text-anchor="start">高分</text>
<path d="M80 156 H910" fill="none" stroke="#96aaa2" stroke-width="2" />
<path d="M80 149 V163" fill="none" stroke="#58716d" stroke-width="1" /><text x="80" y="181" font-size="13" fill="#58716d" font-weight="450" text-anchor="middle">0.00</text><path d="M280 149 V163" fill="none" stroke="#58716d" stroke-width="1" /><text x="280" y="181" font-size="13" fill="#58716d" font-weight="450" text-anchor="middle">0.25</text><path d="M480 149 V163" fill="none" stroke="#58716d" stroke-width="1" /><text x="480" y="181" font-size="13" fill="#58716d" font-weight="450" text-anchor="middle">0.50</text><path d="M680 149 V163" fill="none" stroke="#58716d" stroke-width="1" /><text x="680" y="181" font-size="13" fill="#58716d" font-weight="450" text-anchor="middle">0.75</text><path d="M880 149 V163" fill="none" stroke="#58716d" stroke-width="1" /><text x="880" y="181" font-size="13" fill="#58716d" font-weight="450" text-anchor="middle">1.00</text>
<path d="M480 122 V342" fill="none" stroke="#7760b1" stroke-width="2.3" stroke-dasharray="7 6"/><text x="490" y="125" font-size="16" fill="#7760b1" font-weight="750" text-anchor="start">阈值 = 0.50</text>
<circle cx="816" cy="230" r="12" fill="#13796b" stroke="#fff" stroke-width="2"/><text x="816" y="235" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">+</text><text x="816" y="205" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.92</text><circle cx="720" cy="259" r="12" fill="#bb6842" stroke="#fff" stroke-width="2"/><text x="720" y="264" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">−</text><text x="720" y="234" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.80</text><circle cx="648" cy="230" r="12" fill="#13796b" stroke="#fff" stroke-width="2"/><text x="648" y="235" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">+</text><text x="648" y="205" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.71</text><circle cx="512" cy="259" r="12" fill="#bb6842" stroke="#fff" stroke-width="2"/><text x="512" y="264" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">−</text><text x="512" y="234" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.54</text><circle cx="448" cy="230" r="12" fill="#13796b" stroke="#fff" stroke-width="2"/><text x="448" y="235" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">+</text><text x="448" y="205" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.46</text><circle cx="320" cy="259" r="12" fill="#bb6842" stroke="#fff" stroke-width="2"/><text x="320" y="264" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">−</text><text x="320" y="234" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.30</text><circle cx="192" cy="230" r="12" fill="#bb6842" stroke="#fff" stroke-width="2"/><text x="192" y="235" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">−</text><text x="192" y="205" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.14</text><circle cx="120" cy="259" r="12" fill="#bb6842" stroke="#fff" stroke-width="2"/><text x="120" y="264" font-size="15" fill="#fff" font-weight="750" text-anchor="middle">−</text><text x="120" y="234" font-size="13" fill="#203735" font-weight="650" text-anchor="middle">0.05</text>
<rect x="35" y="343" width="928" height="60" rx="13" fill="#eeeaf7" stroke="#d7e2da"/><text x="55" y="369" font-size="17" fill="#203735" font-weight="720" text-anchor="start">规则：score ≥ 0.50 → 预测正类；否则预测负类</text><text x="55" y="391" font-size="14" fill="#7760b1" font-weight="700" text-anchor="start">本例 TP=2，FP=2，FN=1，TN=3；交互控件可尝试改变阈值。</text>
</g></svg>