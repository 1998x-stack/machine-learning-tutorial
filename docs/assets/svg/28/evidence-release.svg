<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="capstone-evidence-title capstone-evidence-desc"><title id="capstone-evidence-title">模型发布前的可追溯证据与失败回退</title><desc id="capstone-evidence-desc">数据快照、schema、切分时间、代码依赖、参数和测试、指标及失效预案组成发布清单；任何关键项缺失需阻止发布并留痕。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="46" y="48" class="t">上线前检查：产物、证据与回滚目标必须同时可用</text>
<rect x="54" y="125" width="305" height="110" rx="13" class="g"/><text x="206.5" y="158" text-anchor="middle" class="l">数据与定义</text><text x="206.5" y="186" text-anchor="middle" class="s">snapshot · as-of · label</text><text x="206.5" y="214" text-anchor="middle" class="s">split / embargo</text>
<rect x="398" y="125" width="305" height="110" rx="13" class="p"/><text x="550.5" y="158" text-anchor="middle" class="l">实验与依赖</text><text x="550.5" y="186" text-anchor="middle" class="s">code SHA · lockfile · seed</text><text x="550.5" y="214" text-anchor="middle" class="s">CV / metrics / slices</text>
<rect x="742" y="125" width="305" height="110" rx="13" class="o"/><text x="894.5" y="158" text-anchor="middle" class="l">服务与安全</text><text x="894.5" y="186" text-anchor="middle" class="s">schema · auth · latency</text><text x="894.5" y="214" text-anchor="middle" class="s">artifact hash · fallback</text>
<path d="M201 235 V294 H548 V327" class="arrow"/><path d="M550 235 V327" class="arrow"/><path d="M893 235 V294 H548 V327" class="arrow"/>
<rect x="391" y="338" width="318" height="103" rx="13" class="y"/><text x="550" y="371" text-anchor="middle" class="l">Release gate</text><text x="550" y="399" text-anchor="middle" class="s">独立评审 → 审批发布</text><text x="550" y="427" text-anchor="middle" class="s">失败 → 暂停 / 回滚</text>
<text x="58" y="495" class="s">任何不能重现的数据集、模型版本、切分与评价指标，都不应被当作具备可靠回滚能力的发布。</text></svg>