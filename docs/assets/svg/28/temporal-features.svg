<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="capstone-time-title capstone-time-desc"><title id="capstone-time-title">特征 as-of 与预测标签时间窗</title><desc id="capstone-time-desc">特征只读取预测时点 t 以前事件，如 [t-30d,t)；标签从 (t,t+7d] 定义；训练/验证/测试之间需为标签滞后和 embargo 留出空间。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="46" y="48" class="t">时间一致性：今天预测，绝不能用未来的购买信息做特征</text>
<line x1="90" y1="240" x2="1005" y2="240" stroke="#648078" stroke-width="4"/>
<path d="M1005 240 L990 230 L990 250 Z" fill="#648078"/>
<rect x="125" y="161" width="472" height="67" rx="12" class="g"/><text x="360" y="203" class="l" text-anchor="middle">历史特征窗口 [t−30d, t)</text>
<rect x="605" y="161" width="297" height="67" rx="12" class="o"/><text x="753" y="203" class="l" text-anchor="middle">标签窗口 (t, t+7d]</text>
<line x1="600" y1="129" x2="600" y2="343" stroke="#a48138" stroke-width="4" stroke-dasharray="7 5"/>
<text x="600" y="116" class="l" text-anchor="middle">t · 预测时点</text>
<text x="120" y="273" class="s">t−30d</text><text x="873" y="272" class="s">t+7d</text>
<rect x="137" y="327" width="280" height="90" rx="13" class="n"/><text x="277" y="360" text-anchor="middle" class="l">page_views_30d</text><text x="277" y="388" text-anchor="middle" class="s">order_count_30d</text>
<rect x="640" y="327" width="265" height="90" rx="13" class="y"/><text x="772.5" y="360" text-anchor="middle" class="l">purchase_next_7d</text><text x="772.5" y="388" text-anchor="middle" class="s">仅用于训练标签</text>
<text x="105" y="485" class="s">同一事件不能同时成为 t 时点输入和 t 后标签；晚到数据需以真实可用时间（available_at）审计。</text></svg>