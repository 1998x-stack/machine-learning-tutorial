<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="capstone-causal-title capstone-causal-desc"><title id="capstone-causal-title">购买概率、决策阈值与营销增量效应的区别</title><desc id="capstone-causal-desc">高购买概率可能来自自然购买者，并不代表发送优惠券可增量提高购买率；随机化实验需要对比相同策略人群的处理与对照结果，计算增量转化和净价值。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="46" y="48" class="t">预测谁会购买 ≠ 知道优惠券会让谁多购买</text>
<rect x="70" y="142" width="250" height="114" rx="13" class="g"/><text x="195" y="175" text-anchor="middle" class="l">预测模型</text><text x="195" y="203" text-anchor="middle" class="s">P(buy next 7d | X)</text><text x="195" y="231" text-anchor="middle" class="s">排序/校准/阈值</text>
<path d="M320 192 L374 192" class="arrow"/>
<rect x="389" y="142" width="270" height="114" rx="13" class="p"/><text x="524" y="175" text-anchor="middle" class="l">营销策略</text><text x="524" y="203" text-anchor="middle" class="s">有成本与预算约束</text><text x="524" y="231" text-anchor="middle" class="s">可能需随机试验</text>
<path d="M659 195 H705 V132 H759" class="arrow"/><path d="M705 195 V347 H759" class="arrow"/>
<rect x="774" y="91" width="265" height="113" rx="13" class="o"/><text x="906.5" y="124" text-anchor="middle" class="l">随机处理组</text><text x="906.5" y="152" text-anchor="middle" class="s">得到优惠券</text><text x="906.5" y="180" text-anchor="middle" class="s">实际购买 + 成本</text>
<rect x="774" y="305" width="265" height="113" rx="13" class="n"/><text x="906.5" y="338" text-anchor="middle" class="l">随机对照组</text><text x="906.5" y="366" text-anchor="middle" class="s">不送优惠券</text><text x="906.5" y="394" text-anchor="middle" class="s">实际购买</text>
<rect x="80" y="335" width="540" height="113" rx="13" class="y"/>
<text x="110" y="374" class="l">增量效果：E[Y|T=1] − E[Y|T=0]</text>
<text x="110" y="404" class="s">仅在随机化等识别假设满足时估计策略因果效果</text>
<text x="77" y="498" class="s">校准好的购买概率是“基线风险”；折扣可能主要给本来就要购买的客户，甚至损害毛利。</text></svg>