<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="capstone-pipeline-title capstone-pipeline-desc"><title id="capstone-pipeline-title">从购买预测定义到可回滚部署的全链路</title><desc id="capstone-pipeline-desc">数据合约经过时间点一致特征生成、训练/验证/测试、模型流水线登记与灰度部署，再采集监控与延迟标签用于下一轮审查；没有验证就不自动触发上线。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="46" y="48" class="t">一条可复现的 ML 链路，每一步都有独立的验收契约</text>
<rect x="56" y="132" width="178" height="115" rx="13" class="g"/><text x="145" y="165" text-anchor="middle" class="l">业务定义</text><text x="145" y="193" text-anchor="middle" class="s">y: 未来 7 天购买</text><text x="145" y="221" text-anchor="middle" class="s">决策与成本</text>
<path d="M234 187 L277 187" class="arrow"/>
<rect x="289" y="132" width="180" height="115" rx="13" class="p"/><text x="379" y="165" text-anchor="middle" class="l">数据契约</text><text x="379" y="193" text-anchor="middle" class="s">schema · lineage</text><text x="379" y="221" text-anchor="middle" class="s">as-of join</text>
<path d="M469 187 L512 187" class="arrow"/>
<rect x="524" y="132" width="180" height="115" rx="13" class="o"/><text x="614" y="165" text-anchor="middle" class="l">训练 + 验证</text><text x="614" y="193" text-anchor="middle" class="s">Pipeline + CV</text><text x="614" y="221" text-anchor="middle" class="s">校准与阈值</text>
<path d="M704 187 L747 187" class="arrow"/>
<rect x="759" y="132" width="270" height="115" rx="13" class="g"/><text x="894" y="165" text-anchor="middle" class="l">Artifact Registry</text><text x="894" y="193" text-anchor="middle" class="s">model + schema + hash</text><text x="894" y="221" text-anchor="middle" class="s">环境与基线</text>
<path d="M900 247 V307 H853 V338" class="arrow"/>
<rect x="630" y="344" width="354" height="102" rx="13" class="o"/><text x="807" y="377" text-anchor="middle" class="l">金丝雀部署 + 服务</text><text x="807" y="405" text-anchor="middle" class="s">观测延迟 · 错误 · 输出分布</text>
<path d="M630 394 H575" class="arrow"/>
<rect x="316" y="344" width="240" height="102" rx="13" class="p"/><text x="436" y="377" text-anchor="middle" class="l">延迟标签 + 实验</text><text x="436" y="405" text-anchor="middle" class="s">真实效果 / 对照组</text>
<path d="M316 394 H271 V284 H151 V252" class="arrow dash"/>
<text x="56" y="504" class="s">反馈先进入调查和重新验证，不能把任何漂移告警直接等同于“必须自动重新训练上线”。</text></svg>