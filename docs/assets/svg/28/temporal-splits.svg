<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" role="img" aria-labelledby="capstone-split-title capstone-split-desc"><title id="capstone-split-title">带七天标签窗口留白的时序数据集切分</title><desc id="capstone-split-desc">训练、验证与测试按样本预测时点有序切分，中间留出与标签观测期一致的 gap，避免较早样本的未来标签跨过下一阶段开始时间。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#648078" d="M0 0L10 5L0 10Z"/></marker><marker id="org" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#c16a43" d="M0 0L10 5L0 10Z"/></marker><style>text{font-family:Inter,system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#25403b}.t{font-size:24px;font-weight:750}.l{font-size:18px;font-weight:660}.s{font-size:15px;fill:#4d6962}.xs{font-size:13px;fill:#5b736c}.n{fill:#fffefa;stroke:#b7c8c0;stroke-width:2}.g{fill:#e1f1e9;stroke:#16786f;stroke-width:2}.o{fill:#fbe8dc;stroke:#bc6a47;stroke-width:2}.p{fill:#eee9f8;stroke:#7863b0;stroke-width:2}.y{fill:#f9f1dc;stroke:#a48138;stroke-width:2}.dash{stroke-dasharray:7 6}.arrow{stroke:#648078;stroke-width:2.4;fill:none;marker-end:url(#arr)}.warn{stroke:#c16a43;stroke-width:2.4;fill:none;marker-end:url(#org)}</style></defs><rect width="1100" height="540" rx="22" fill="#fbfaf6"/><text x="46" y="48" class="t">时序切分必须遵守标签观察期，而非随机洗牌</text>
<text x="53" y="104" class="s">按预测时点 t 排序，未来 7 天购买为 y；假设需要完整 7 天才能知道 y。</text>
<rect x="60" y="145" width="455" height="92" rx="10" class="g"/><text x="288" y="195" text-anchor="middle" class="l">Train</text>
<rect x="515" y="145" width="57" height="92" class="y"/><text x="544" y="181" text-anchor="middle" class="xs">gap</text><text x="544" y="206" text-anchor="middle" class="xs">7d</text>
<rect x="572" y="145" width="205" height="92" class="p"/><text x="674" y="195" text-anchor="middle" class="l">Validation</text>
<rect x="777" y="145" width="57" height="92" class="y"/><text x="805" y="181" text-anchor="middle" class="xs">gap</text><text x="805" y="206" text-anchor="middle" class="xs">7d</text>
<rect x="834" y="145" width="202" height="92" rx="10" class="o"/><text x="935" y="195" text-anchor="middle" class="l">Test</text>
<rect x="60" y="298" width="285" height="112" rx="13" class="n"/><text x="202.5" y="331" text-anchor="middle" class="l">Train</text><text x="202.5" y="359" text-anchor="middle" class="s">fit scaler/encoder/model</text><text x="202.5" y="387" text-anchor="middle" class="s">选候选结构</text>
<rect x="399" y="298" width="285" height="112" rx="13" class="n"/><text x="541.5" y="331" text-anchor="middle" class="l">Validation</text><text x="541.5" y="359" text-anchor="middle" class="s">调阈值和超参数</text><text x="541.5" y="387" text-anchor="middle" class="s">制定发布策略</text>
<rect x="738" y="298" width="285" height="112" rx="13" class="n"/><text x="880.5" y="331" text-anchor="middle" class="l">Test（一次）</text><text x="880.5" y="359" text-anchor="middle" class="s">最终独立报告</text><text x="880.5" y="387" text-anchor="middle" class="s">不可反复调参</text>
<text x="60" y="483" class="s">gap 解决边界标签重叠；重复用户、同源会话和延迟到达的事件仍可能需要额外去重与数据可用性规则。</text></svg>