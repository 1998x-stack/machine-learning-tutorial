<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t22b d22b" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="t22b" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">LSTM 单元的三个门与细胞状态</title><desc id="d22b" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">输入 x_t 与上一步状态 h_{t−1} 同时送入遗忘门、输入门与输出门；遗忘门与输入门更新细胞状态 c_t，输出门决定输出 h_t。</desc><rect x="1" y="1" width="998" height="328" rx="18" fill="#fffdf9" stroke="#d8e2d9" style=";fill:rgb(255, 253, 249);stroke:rgb(216, 226, 217);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><text x="40" y="45" font-size="22" fill="#213a37" font-weight="760" style=";fill:rgb(33, 58, 55);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:22px;font-weight:760;text-anchor:start;color:rgb(0, 0, 