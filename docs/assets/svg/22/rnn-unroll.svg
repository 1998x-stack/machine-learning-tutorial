<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="rnn-unroll-title rnn-unroll-desc">
<title id="rnn-unroll-title">循环网络沿时间展开</title><desc id="rnn-unroll-desc">同一组参数在每个时间步重复使用；隐藏状态 h_t 把前序信息传递到下一步。</desc>
<defs>
 <marker id="rnn-unroll-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="rnn-unroll-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#rnn-unroll-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#rnn-unroll-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">一个循环单元，沿时间轴重复执行</text>
<rect x="90" y="170" width="120" height="92" rx="14" class="purple"/><text x="150" y="205" text-anchor="middle" class="label">RNN cell</text><text x="150" y="235" text-anchor="middle" class="small">共享参数</text><rect x="118" y="85" width="64" height="46" rx="9" class="green"/><text x="150" y="114" text-anchor="middle" class="label">x1</text><path d="M150 132 V165" class="line"/><rect x="118" y="315" width="64" height="46" rx="9" class="orange"/><text x="150" y="344" text-anchor="middle" class="label">y1</text><path d="M150 264 V310" class="line"/><rect x="290" y="170" width="120" height="92" rx="14" class="purple"/><text x="350" y="205" text-anchor="middle" class="label">RNN cell</text><text x="350" y="235" text-anchor="middle" class="small">共享参数</text><rect x="318" y="85" width="64" height="46" rx="9" class="green"/><text x="350" y="114" text-anchor="middle" class="label">x2</text><path d="M350 132 V165" class="line"/><rect x="318" y="315" width="64" height="46" rx="9" class="orange"/><text x="350" y="344" text-anchor="middle" class="label">y2</text><path d="M350 264 V310" class="line"/><rect x="490" y="170" width="120" height="92" rx="14" class="purple"/><text x="550" y="205" text-anchor="middle" class="label">RNN cell</text><text x="550" y="235" text-anchor="middle" class="small">共享参数</text><rect x="518" y="85" width="64" height="46" rx="9" class="green"/><text x="550" y="114" text-anchor="middle" class="label">x3</text><path d="M550 132 V165" class="line"/><rect x="518" y="315" width="64" height="46" rx="9" class="orange"/><text x="550" y="344" text-anchor="middle" class="label">y3</text><path d="M550 264 V310" class="line"/><rect x="690" y="170" width="120" height="92" rx="14" class="purple"/><text x="750" y="205" text-anchor="middle" class="label">RNN cell</text><text x="750" y="235" text-anchor="middle" class="small">共享参数</text><rect x="718" y="85" width="64" height="46" rx="9" class="green"/><text x="750" y="114" text-anchor="middle" class="label">x4</text><path d="M750 132 V165" class="line"/><rect x="718" y="315" width="64" height="46" rx="9" class="orange"/><text x="750" y="344" text-anchor="middle" class="label">y4</text><path d="M750 264 V310" class="line"/>
<path d="M210 216 H280" class="line"/><text x="245" y="195" text-anchor="middle" class="small">h1</text><path d="M410 216 H480" class="line"/><text x="445" y="195" text-anchor="middle" class="small">h2</text><path d="M610 216 H680" class="line"/><text x="645" y="195" text-anchor="middle" class="small">h3</text>
<text x="60" y="420" class="small">hₜ = φ(Wₓ xₜ + Wₕ hₜ₋₁ + b)；每一步复用 Wₓ、Wₕ、b。</text>
</svg>