<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="gen-vae-title gen-vae-desc">
<title id="gen-vae-title">VAE 的编码、重参数化与解码</title><desc id="gen-vae-desc">编码器输出均值 μ 和对数方差 log σ²；用 z=μ+σ⊙ε 采样，使梯度能穿过随机节点回传。</desc>
<defs>
 <marker id="gen-vae-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="gen-vae-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#gen-vae-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#gen-vae-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">VAE 学习一个可采样的潜在分布，而不只是压缩向量</text>
<rect x="55" y="160" width="125" height="80" rx="12" class="green"/><text x="117" y="193" text-anchor="middle" class="label">输入 x</text><text x="117" y="220" text-anchor="middle" class="small">图像 / 样本</text><path d="M180 200 H245" class="line"/>
<rect x="260" y="145" width="150" height="110" rx="12" class="purple"/><text x="335" y="185" text-anchor="middle" class="label">Encoder qφ</text><text x="335" y="215" text-anchor="middle" class="small">μ(x), log σ²(x)</text>
<path d="M410 200 H475" class="line"/>
<rect x="490" y="115" width="165" height="170" rx="12" class="orange"/><text x="572" y="155" text-anchor="middle" class="label">Reparameterize</text><text x="572" y="192" text-anchor="middle" class="small">ε ~ N(0,I)</text><text x="572" y="225" text-anchor="middle" class="small">z = μ + σ ⊙ ε</text><text x="572" y="258" text-anchor="middle" class="small">随机性移到 ε</text>
<path d="M655 200 H715" class="line"/><rect x="730" y="160" width="125" height="80" rx="12" class="green"/><text x="792" y="193" text-anchor="middle" class="label">Decoder pθ</text><text x="792" y="220" text-anchor="middle" class="small">重建 x̂</text>
<rect x="155" y="330" width="590" height="68" rx="12" class="box"/><text x="450" y="359" text-anchor="middle" class="label">ELBO = E_q[log pθ(x|z)] − KL(qφ(z|x) || p(z))</text><text x="450" y="384" text-anchor="middle" class="small">重建质量与潜在分布正则化之间的权衡</text>
</svg>