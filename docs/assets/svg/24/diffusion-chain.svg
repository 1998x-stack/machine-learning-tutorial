<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="gen-diffusion-title gen-diffusion-desc">
<title id="gen-diffusion-title">扩散模型的前向加噪与反向去噪</title><desc id="gen-diffusion-desc">前向链按固定噪声日程逐步扰动真实样本；模型学习从 xt 与时间步 t 预测噪声或等价参数化，再反向采样。</desc>
<defs>
 <marker id="gen-diffusion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="gen-diffusion-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#gen-diffusion-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#gen-diffusion-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">Diffusion：训练时加噪，生成时从噪声反向还原</text>
<text x="60" y="105" class="label">前向过程 q(xₜ | xₜ₋₁)</text>
<rect x="55" y="130" width="135" height="82" rx="12" class="green"/><text x="122" y="164" text-anchor="middle" class="label">x₀ · 数据</text><text x="122" y="190" text-anchor="middle" class="small">干净样本</text><rect x="225" y="130" width="135" height="82" rx="12" class="box"/><text x="292" y="164" text-anchor="middle" class="label">x₁</text><text x="292" y="190" text-anchor="middle" class="small">轻微扰动</text><rect x="395" y="130" width="135" height="82" rx="12" class="box"/><text x="462" y="164" text-anchor="middle" class="label">x₂</text><text x="462" y="190" text-anchor="middle" class="small">噪声增加</text><rect x="565" y="130" width="135" height="82" rx="12" class="box"/><text x="632" y="164" text-anchor="middle" class="label">x₃</text><text x="632" y="190" text-anchor="middle" class="small">结构变弱</text><rect x="735" y="130" width="135" height="82" rx="12" class="amber"/><text x="802" y="164" text-anchor="middle" class="label">xT · 噪声</text><text x="802" y="190" text-anchor="middle" class="small">近似高斯</text>
<path d="M190 170 H225" class="oline"/><path d="M360 170 H395" class="oline"/><path d="M530 170 H565" class="oline"/><path d="M700 170 H735" class="oline"/>
<line x1="50" y1="255" x2="850" y2="255" stroke="#d5ddd5"/>
<text x="60" y="300" class="label">反向生成 pθ(xₜ₋₁ | xₜ)</text>
<rect x="55" y="325" width="135" height="82" rx="12" class="amber"/><text x="122" y="359" text-anchor="middle" class="label">xT · 噪声</text><text x="122" y="385" text-anchor="middle" class="small">随机初始化</text><rect x="225" y="325" width="135" height="82" rx="12" class="purple"/><text x="292" y="359" text-anchor="middle" class="label">x₃</text><text x="292" y="385" text-anchor="middle" class="small">去噪一步</text><rect x="395" y="325" width="135" height="82" rx="12" class="purple"/><text x="462" y="359" text-anchor="middle" class="label">x₂</text><text x="462" y="385" text-anchor="middle" class="small">去噪一步</text><rect x="565" y="325" width="135" height="82" rx="12" class="purple"/><text x="632" y="359" text-anchor="middle" class="label">x₁</text><text x="632" y="385" text-anchor="middle" class="small">去噪一步</text><rect x="735" y="325" width="135" height="82" rx="12" class="green"/><text x="802" y="359" text-anchor="middle" class="label">x₀ · 样本</text><text x="802" y="385" text-anchor="middle" class="small">生成结果</text>
<path d="M225 365 H190" class="line"/><path d="M395 365 H360" class="line"/><path d="M565 365 H530" class="line"/><path d="M735 365 H700" class="line"/>
</svg>