<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="gen-families-title gen-families-desc">
<title id="gen-families-title">四类生成建模路径</title><desc id="gen-families-desc">自回归模型逐步因子化联合分布；VAE 显式引入潜变量；GAN 通过对抗目标学习隐式分布；Diffusion 学习逐步反向去噪。</desc>
<defs>
 <marker id="gen-families-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="gen-families-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#gen-families-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#gen-families-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">“生成”不是单一算法：不同家族学习不同形式的分布结构</text>
<rect x="55" y="105" width="365" height="120" rx="14" class="green"/><text x="80" y="140" class="label">自回归</text><text x="80" y="177" class="small">p(x)=∏ p(xₜ|x&lt;ₜ)</text><text x="80" y="205" class="small">下一个 token / 像素</text><rect x="465" y="105" width="365" height="120" rx="14" class="purple"/><text x="490" y="140" class="label">VAE</text><text x="490" y="177" class="small">p(x,z)=p(z)p(x|z)</text><text x="490" y="205" class="small">显式潜变量与 ELBO</text><rect x="55" y="260" width="365" height="120" rx="14" class="orange"/><text x="80" y="295" class="label">GAN</text><text x="80" y="332" class="small">minG maxD V(D,G)</text><text x="80" y="360" class="small">生成器与判别器博弈</text><rect x="465" y="260" width="365" height="120" rx="14" class="amber"/><text x="490" y="295" class="label">Diffusion</text><text x="490" y="332" class="small">q(xₜ|xₜ₋₁) → pθ(xₜ₋₁|xₜ)</text><text x="490" y="360" class="small">加噪与反向去噪</text>
<text x="60" y="430" class="small">比较时先问：概率密度是否可计算？潜变量是否显式？训练目标是什么？采样需要多少步？</text>
</svg>