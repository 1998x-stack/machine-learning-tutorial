<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">二维超参数空间中的网格搜索与随机搜索</title><desc id="desc">两侧展示 12 次候选评分的二维示意。网格以固定值组合覆盖，随机搜索按采样分布选候选；等预算下覆盖形状不同，不意味着随机搜索必胜。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="44" font-size="22" fill="#213a37" font-weight="760" text-anchor="start">同样的试验预算，搜索点覆盖方式不同</text>
