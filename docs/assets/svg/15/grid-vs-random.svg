706c" font-weight="500" text-anchor="start">参数 B</text><rect x="517" y="79" width="445" height="317" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="539" y="113" font-size="18" fill="#c4774b" font-weight="740" text-anchor="start">随机采样：12 次评估</text><path d="M586 349 V139 M586 349 H907" fill="none" stroke="#a4b2aa" stroke-width="1.8" stroke-linecap="round" /><path d="M666 142 V349" fill="none" stroke="#d8e2d9" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M746 142 V349" fill="none" stroke="#d8e2d9" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M826 142 V349" fill="none" stroke="#d8e2d9" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M587 279 H907" fill="none" stroke="#d8e2d9" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><path d="M587 209 H907" fill="none" stroke="#d8e2d9" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5"/><circle cx="622.2" cy="170.5" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="670.2" cy="296.5" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="721.4" cy="216.7" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="772.6" cy="317.5" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="820.6" cy="183.1" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="868.6" cy="260.8" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="699" cy="160" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="791.8" cy="241.89999999999998" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="641.4" cy="246.10000000000002" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="843" cy="317.5" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="753.4" cy="279.7" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="884.6" cy="155.79999999999998" r="6" fill="#c4774b" stroke="white" stroke-width="2"/><text x="595" y=