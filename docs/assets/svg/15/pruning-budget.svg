<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">有限试验预算下的超参数优化与提前终止</title><desc id="desc">四条人工构造的验证损失趋势，两个表现差的试验提前停止，表现好的继续；提前终止依据可比较的中间指标，不代表有绝对正确的停止规则。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" font-size="21" fill="#213a37" font-weight="740" text-anchor="start">Pruning：把计算预算从明显差的试验转向有希望的试验</text>
