<text x="325" y="200" font-size="15" fill="#c4774b" font-weight="750" text-anchor="start">中止</text><text x="223" y="205" font-size="15" fill="#c4774b" font-weight="750" text-anchor="start">中止</text>
<rect x="699" y="106" width="260" height="246" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="719" y="143" font-size="18" fill="#725cb0" font-weight="740" text-anchor="start">每次 trial 包含</text>
<text x="719" y="176" font-size="16" fill="#213a37" font-weight="500" text-anchor="start">候选参数</text><text x="719" y="208" font-size="16" fill="#213a37" font-weight="500" text-anchor="start">训练 + 中间评分</text><text x="719" y="240" font-size="16" fill="#213a37" font-weight="500" text-anchor="start">继续 / 停止决策</text>
