<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">嵌套交叉验证内外循环的职责</title><desc id="desc">外层训练折用于整个超参数选择过程，内层交叉验证评估候选，再在外层保留折上测试这个选择过程；最终全数据重新拟合部署模型。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="45" font-size="22" fill="#213a37" font-weight="750" text-anchor="start">内层选择参数，外层评估“选择流程”的泛化</text>
<rect x="34" y="95" width="256" height="75" rx="12" fill="#e9f5ee" stroke="#d8e2d9"/><text x="52" y="125" font-size="18" fill="#147b70" font-weight="750" text-anchor="start">全部开发数据</text><text x="52" y="151" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">外层 K 折切分</text>
<path d="M291 132 H333" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="337" y="93" width="285" height="80" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="356" y="125" font-size="18" fill="#725cb0" font-weight="750" text-anchor="start">外层训练部分</text><text x="356" y="149" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">只在这里搜索参数</text>
<path d="M479 174 V222" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="337" y="226" width="285" height="87" rx="12" fill="#faeee6" stroke="#d8e2d9"/><text x="355" y="259" font-size="19" fill="#c4774b" font-weight="750" text-anchor="start">内层 CV</text><text x="355" y="285" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">各候选反复 fit/score</text>
<path d="M624 265 H667" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="670" y="225" width="291" height="88" rx="12" fill="#e9f5ee" stroke="#d8e2d9"/><text x="688" y="259" font-size="17" fill="#147b70" font-weight="700" text-anchor="start">选择最优候选并重新拟合</text><text x="688" y="285" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">只用当前外层训练部分</text>
<rect x="670" y="92" width="291" height="81" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="688" y="123" font-size="18" fill="#725cb0" font-weight="730" text-anchor="start">外层验证折</text><text x="688" y="150" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">不参与内层选择</text>
<path d="M812 174 V220" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="35" y="362" font-size="15" fill="#213a37" font-weight="680" text-anchor="start">重复整个外层过程，汇总外层分数 → 评估搜索策略，而不是挑一个最好看的单折数值。</text>
<text x="35" y="421" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">真正部署时再在适当的开发数据上独立确定参数并 fit；另留测试集仍需遵守任务切分要求。</text>
</g></svg>