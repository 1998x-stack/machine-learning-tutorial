<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="rl-loop-title rl-loop-desc">
<title id="rl-loop-title">强化学习的智能体—环境闭环</title><desc id="rl-loop-desc">智能体依据状态或观测选择动作；环境推进状态并返回奖励、下一观测以及终止/截断信号。</desc>
<defs>
 <marker id="rl-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="rl-loop-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#rl-loop-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#rl-loop-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">强化学习的样本来自行动后的反馈，而不是静态标签</text>
<rect x="315" y="105" width="270" height="105" rx="16" class="purple"/><text x="450" y="148" text-anchor="middle" class="label">Agent / Policy</text><text x="450" y="180" text-anchor="middle" class="small">π(a | s) 或 Q(s,a)</text>
<rect x="315" y="300" width="270" height="105" rx="16" class="green"/><text x="450" y="343" text-anchor="middle" class="label">Environment</text><text x="450" y="375" text-anchor="middle" class="small">状态转移与奖励函数</text>
<path d="M450 210 V295" class="line"/><text x="475" y="255" class="label">aₜ</text><path d="M315 352 H170 V155 H310" class="line"/><text x="185" y="332" class="label">rₜ₊₁, sₜ₊₁</text>
<rect x="45" y="110" width="195" height="80" rx="12" class="amber"/><text x="142" y="145" text-anchor="middle" class="label">反馈信号</text><text x="142" y="171" text-anchor="middle" class="small">reward / done flags</text><path d="M240 150 H305" class="line"/>
<text x="55" y="440" class="small">策略目标是长期期望回报；奖励只是目标信号，不等于真实业务价值本身。</text>
</svg>