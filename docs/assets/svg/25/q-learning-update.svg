<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="rl-qlearn-title rl-qlearn-desc">
<title id="rl-qlearn-title">Q-Learning 的时序差分更新</title><desc id="rl-qlearn-desc">用即时奖励与下一状态最大动作价值构造目标，再按学习率把旧 Q 值向目标移动。</desc>
<defs>
 <marker id="rl-qlearn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="rl-qlearn-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#rl-qlearn-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#rl-qlearn-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">Q-Learning：不必先知道环境转移概率</text>
<rect x="55" y="120" width="155" height="78" rx="12" class="green"/><text x="132" y="154" text-anchor="middle" class="label">Q(s,a)</text><text x="132" y="180" text-anchor="middle" class="small">旧估计</text>
<path d="M210 160 H275" class="line"/><rect x="290" y="120" width="170" height="78" rx="12" class="orange"/><text x="375" y="154" text-anchor="middle" class="label">r + γ max Q(s′,a′)</text><text x="375" y="180" text-anchor="middle" class="small">TD target</text>
<path d="M460 160 H525" class="line"/><rect x="540" y="120" width="150" height="78" rx="12" class="purple"/><text x="615" y="154" text-anchor="middle" class="label">TD error δ</text><text x="615" y="180" text-anchor="middle" class="small">target − old</text>
<path d="M690 160 H745" class="line"/><rect x="760" y="120" width="100" height="78" rx="12" class="green"/><text x="810" y="165" text-anchor="middle" class="label">更新 Q</text>
<rect x="90" y="270" width="720" height="95" rx="14" class="box"/><text x="450" y="310" text-anchor="middle" class="label">Q ← Q + α [r + γ maxₐ′ Q(s′,a′) − Q]</text><text x="450" y="340" text-anchor="middle" class="small">off-policy：目标使用下一状态的贪心价值，即使当前行为策略在探索。</text>
<text x="60" y="425" class="small">若真正终止，目标不含下一状态价值；若只是外部时间截断，通常仍需 bootstrap。</text>
</svg>