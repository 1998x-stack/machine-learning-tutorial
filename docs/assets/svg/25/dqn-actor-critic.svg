<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="rl-deep-architectures-title rl-deep-architectures-desc">
<title id="rl-deep-architectures-title">DQN 与 Actor–Critic 的学习结构</title><desc id="rl-deep-architectures-desc">DQN 用在线 Q 网络、目标网络和 replay buffer；Actor–Critic 则分别估计策略与价值。</desc>
<defs>
 <marker id="rl-deep-architectures-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#55736d"/></marker>
 <marker id="rl-deep-architectures-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bc6a47"/></marker>
 <style>text{font-family:Inter,ui-sans-serif,system-ui,"Noto Sans CJK SC",sans-serif;fill:#203b38}.title{font-size:22px;font-weight:750}.label{font-size:16px;font-weight:650}.small{font-size:13px;fill:#536b66}.tiny{font-size:12px;fill:#536b66}.box{fill:#fffdf8;stroke:#a9bdb3;stroke-width:2}.green{fill:#e3f1eb;stroke:#16786f;stroke-width:2}.orange{fill:#f8e9df;stroke:#bc6a47;stroke-width:2}.purple{fill:#eee9f7;stroke:#7863b0;stroke-width:2}.amber{fill:#f7f0dc;stroke:#9b7533;stroke-width:2}.line{fill:none;stroke:#55736d;stroke-width:2.5;marker-end:url(#rl-deep-architectures-arrow)}.oline{fill:none;stroke:#bc6a47;stroke-width:2.5;marker-end:url(#rl-deep-architectures-orange)}.dash{stroke-dasharray:7 6}</style>
</defs><rect width="900" height="460" rx="22" fill="#fbfaf6"/>
<text x="40" y="42" class="title">两类深度强化学习结构解决不同的优化问题</text>
<text x="60" y="95" class="label">DQN · 离散动作值函数</text>
<rect x="55" y="120" width="130" height="62" rx="10" class="green"/><text x="120" y="158" text-anchor="middle" class="label">Replay</text><path d="M185 150 H250" class="line"/><rect x="265" y="120" width="155" height="62" rx="10" class="purple"/><text x="342" y="158" text-anchor="middle" class="label">Online Qθ</text><path d="M420 150 H485" class="line"/><rect x="500" y="120" width="135" height="62" rx="10" class="orange"/><text x="567" y="158" text-anchor="middle" class="label">TD loss</text><rect x="500" y="205" width="135" height="55" rx="10" class="box"/><text x="567" y="238" text-anchor="middle" class="small">Target Qθ−</text><path d="M567 182 V200" class="line"/>
<text x="60" y="305" class="label">Actor–Critic · 直接策略优化</text>
<rect x="55" y="330" width="130" height="62" rx="10" class="green"/><text x="120" y="368" text-anchor="middle" class="label">State s</text><path d="M185 360 H250" class="line"/><rect x="265" y="320" width="155" height="55" rx="10" class="purple"/><text x="342" y="354" text-anchor="middle" class="label">Actor πθ</text><rect x="265" y="385" width="155" height="55" rx="10" class="orange"/><text x="342" y="419" text-anchor="middle" class="label">Critic Vφ</text><path d="M420 347 H485" class="line"/><rect x="500" y="320" width="155" height="55" rx="10" class="green"/><text x="577" y="354" text-anchor="middle" class="small">Action dist.</text><path d="M420 412 H485" class="line"/><rect x="500" y="385" width="155" height="55" rx="10" class="amber"/><text x="577" y="419" text-anchor="middle" class="small">Advantage</text><text x="700" y="360" class="small">PPO 约束策略更新幅度</text><text x="700" y="385" class="small">不是“所有 RL 的默认答案”</text>
</svg>