<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t25b d25b" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="t25b" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">Q-Learning 的一次时序差分备份</title><desc id="d25b" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">从状态 s 选动作 a 得到奖励 r 并转移到 s'；在 s' 的所有动作价值里取最大值作为下一状态价值；用 r 加 γ 乘该最大值作为目标，修正 Q(s,a)。</desc><rect x="1" y="1" width="998" height="318" rx="18" fill="#fffdf9" stroke="#d8e2d9" style=";fill:rgb(255, 253, 249);stroke:rgb(216, 226, 217);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><text x="40" y="45" font-size="22" fill="#213a37" font-weight="760" style=";fill:rgb(33, 58, 55);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:22px;font-weight:760;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">用下一步的最大价值回头修正这一步</text><circle cx="150" cy="170" r="30" fill="#efeaf7" stroke="#7863b0" stroke-width="1.8" style=";fill:rgb(239, 234, 247);stroke:rgb(120, 99, 176);stroke-width:1.8px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></circle><text x="150" y="176" font-size="15" fill="#66529e" text-anchor="middle" style=";fill:rgb(102, 82, 158);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:15px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">s</text><text x="150" y="128" font-size="12.5" fill="#57706c" text-anchor="middle" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">当前状态</text><circle cx="640" cy="170" r="30" fill="#e7f3ef" stroke="#147b70" stroke-width="1.8" style=";fill:rgb(231, 243, 239);stroke:rgb(20, 123, 112);stroke-width:1.8px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></circle><text x="640" y="176" font-size="15" fill="#147b70" text-anchor="middle" style=";fill:rgb(20, 123, 112);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:15px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">s′</text><text x="640" y="128" font-size="12.5" fill="#57706c" text-anchor="middle" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">下一状态</text><path d="M180 170 H606" fill="none" stroke="#57706c" stroke-width="1.8" marker-end="url(#ar25a)" style=";stroke:rgb(87, 112, 108);stroke-width:1.8px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="393" y="158" font-size="12.5" fill="#b5673f" text-anchor="middle" style=";fill:rgb(181, 103, 63);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">选动作 a，得到奖励 r</text><rect x="760" y="120" width="200" height="100" rx="10" fill="#fff7ec" stroke="#c4774b" style=";fill:rgb(255, 247, 236);stroke:rgb(196, 119, 75);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="860" y="156" font-size="13" fill="#b5673f" text-anchor="middle" style=";fill:rgb(181, 103, 63);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">目标 = r + γ·max_a′ Q(s′,a′)</text><text x="860" y="182" font-size="12.5" fill="#c58a6f" text-anchor="middle" style=";fill:rgb(197, 138, 111);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">TD 误差 = 目标 − Q(s,a)</text><path d="M670 150 H756" fill="none" stroke="#57706c" stroke-width="1.6" marker-end="url(#ar25a)" style=";stroke:rgb(87, 112, 108);stroke-width:1.6px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M760 190 C520 280 260 280 165 202" fill="none" stroke="#c4774b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar25a)" style=";stroke:rgb(196, 119, 75);stroke-width:1.8px;stroke-dasharray:6px, 5px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="470" y="292" font-size="12.5" fill="#b5673f" text-anchor="middle" style=";fill:rgb(181, 103, 63);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12.5px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">按学习率 α 朝目标修正 Q(s,a)</text><text x="40" y="312" font-size="12.5" fill="#57706c" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:12.5px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">教学示意：max 取的是下一状态所有动作价值中的最大值。</text></g></svg>
