<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t17a d17a" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><title id="t17a" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">从内生可解释到黑盒的谱系</title><desc id="t17a" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">一条从左到白盒、右到黑盒的谱系：线性/逻辑回归、浅树为白盒；随机森林、GBDT 为灰盒；深度网络为黑盒。上方标注内生解释，下方标注后置解释工具及其适用范围。</desc><rect x="1" y="1" width="998" height="338" rx="18" fill="#fffdf9" stroke="#d8e2d9" style=";fill:rgb(255, 253, 249);stroke:rgb(216, 226, 217);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:Times;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif" style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><text x="40" y="45" font-size="22" fill="#213a37" font-weight="760" style=";fill:rgb(33, 58, 55);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:22px;font-weight:760;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">可解释性是一条谱系，不是二元标签</text><path d="M70 170 H930" stroke="#a4b2aa" stroke-width="2" style=";fill:rgb(0, 0, 0);stroke:rgb(164, 178, 170);stroke-width:2px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><path d="M920 164 L936 170 L920 176 Z" fill="#a4b2aa" style=";fill:rgb(164, 178, 170);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="70" y="204" font-size="14" fill="#147b70" font-weight="700" style=";fill:rgb(20, 123, 112);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">白盒（内生）</text><text x="856" y="204" font-size="14" fill="#c4774b" font-weight="700" style=";fill:rgb(196, 119, 75);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:700;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">黑盒</text><g style=";fill:rgb(0, 0, 0);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"><rect x="70" y="120" width="180" height="46" rx="9" fill="#e7f3ef" stroke="#147b70" style=";fill:rgb(231, 243, 239);stroke:rgb(20, 123, 112);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="160" y="149" font-size="14" fill="#147b70" text-anchor="middle" style=";fill:rgb(20, 123, 112);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">线性 / 逻辑回归</text><rect x="290" y="120" width="180" height="46" rx="9" fill="#e7f3ef" stroke="#147b70" style=";fill:rgb(231, 243, 239);stroke:rgb(20, 123, 112);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="380" y="149" font-size="14" fill="#147b70" text-anchor="middle" style=";fill:rgb(20, 123, 112);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">浅层决策树</text><rect x="510" y="120" width="180" height="46" rx="9" fill="#f8ede6" stroke="#c4774b" style=";fill:rgb(248, 237, 230);stroke:rgb(196, 119, 75);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="600" y="149" font-size="14" fill="#b5673f" text-anchor="middle" style=";fill:rgb(181, 103, 63);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">随机森林 / GBDT</text><rect x="730" y="120" width="200" height="46" rx="9" fill="#efeaf7" stroke="#7863b0" style=";fill:rgb(239, 234, 247);stroke:rgb(120, 99, 176);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></rect><text x="830" y="149" font-size="14" fill="#66529e" text-anchor="middle" style=";fill:rgb(102, 82, 158);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">深度神经网络</text></g><text x="160" y="104" font-size="13" fill="#57706c" text-anchor="middle" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">系数 / 规则直接可读</text><text x="830" y="104" font-size="13" fill="#57706c" text-anchor="middle" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:middle;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">需要外部工具</text><path d="M70 252 H930" stroke="#d8e2d9" stroke-width="1.4" stroke-dasharray="5 5" style=";fill:rgb(0, 0, 0);stroke:rgb(216, 226, 217);stroke-width:1.4px;stroke-dasharray:5px, 5px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible"></path><text x="70" y="284" font-size="14" fill="#57706c" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">后置解释工具（SHAP / LIME / PDP）适用于整条谱系，</text><text x="70" y="310" font-size="14" fill="#57706c" style=";fill:rgb(87, 112, 108);stroke-width:1px;stroke-linejoin:miter;stroke-linecap:butt;opacity:1;font-family:system-ui, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;font-size:14px;font-weight:400;text-anchor:start;color:rgb(0, 0, 0);fill-rule:nonzero;clip-rule:nonzero;visibility:visible">但对高度非线性模型的近似误差可能更大，需用一致性检查验证。</text></g></svg>
