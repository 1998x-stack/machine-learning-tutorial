<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">SHAP 局部解释把模型输出分解为基线与特征贡献</title><desc id="desc">基线 0.30 加上特征 A 的正贡献 0.18、特征 B 的负贡献 -0.10、特征 C 的正贡献 0.07，得到模型输出 0.45。数值是构造的可加性示例，输出空间需与解释器一致。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">一个样本的加法分解（教学数值）</text><text x="40" y="104" font-size="15" fill="#65776f" font-weight="650" text-anchor="start">基线</text><rect x="40" y="125" width="160" height="62" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="120" y="164" font-size="25" fill="#147b70" font-weight="750" text-anchor="middle">0.30</text><path d="M200 156 L255 156" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="255" y="125" width="190" height="62" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="350" y="164" font-size="24" fill="#147b70" font-weight="750" text-anchor="middle">+0.18</text><text x="350" y="205" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">特征 A</text><path d="M445 156 L500 156" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="500" y="125" width="170" height="62" rx="12" fill="#f7eee8" stroke="#d8e2d9"/><text x="585" y="164" font-size="24" fill="#bc6a47" font-weight="750" text-anchor="middle">−0.10</text><text x="585" y="205" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">特征 B</text><path d="M670 156 L725 156" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="725" y="125" width="135" height="62" rx="12" fill="#eaf4ed" stroke="#d8e2d9"/><text x="792" y="164" font-size="23" fill="#147b70" font-weight="750" text-anchor="middle">+0.07</text><text x="792" y="205" font-size="14" fill="#52675f" font-weight="550" text-anchor="middle">特征 C</text><path d="M860 156 L900 156" fill="none" stroke="#60746d" stroke-width="2" stroke-linecap="round"/><rect x="900" y="125" width="70" height="62" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="935" y="164" font-size="22" fill="#7863b0" font-weight="750" text-anchor="middle">0.45</text><text x="40" y="280" font-size="17" fill="#52675f" font-weight="650" text-anchor="start">φ₀ = 0.30</text><text x="40" y="315" font-size="17" fill="#52675f" font-weight="650" text-anchor="start">φ₁ + φ₂ + φ₃ = 0.15</text><text x="40" y="350" font-size="20" fill="#203a36" font-weight="750" text-anchor="start">f(x) = φ₀ + Σᵢ φᵢ = 0.45</text><text x="40" y="405" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">SHAP 解释的是选定输出空间中的模型预测分解，不是现实世界的因果贡献。</text></g></svg>