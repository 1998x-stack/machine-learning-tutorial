<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">PDP 是 ICE 曲线的样本平均</title><desc id="desc">三条 ICE 曲线分别展示三个样本在改变一个特征时的预测响应，粗线 PDP 是其平均。图形为概念示意；特征相关时 PDP 可能构造不现实的特征组合。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">个体响应不同，平均曲线会掩盖异质性</text><path d="M110 345 L895 345" fill="none" stroke="#73867e" stroke-width="2" stroke-linecap="round"/><path d="M110 345 L110 90" fill="none" stroke="#73867e" stroke-width="2" stroke-linecap="round"/><text x="495" y="390" font-size="15" fill="#53675f" font-weight="650" text-anchor="middle">被考察的特征 xⱼ</text><text x="45" y="100" font-size="14" fill="#53675f" font-weight="650" text-anchor="start">预测</text><path d="M120 310 C280 300 430 270 560 220 S760 160 880 145" fill="none" stroke="#bc6a47" stroke-width="2.5" opacity=".85"/><path d="M120 285 C270 260 400 250 560 235 S760 225 880 215" fill="none" stroke="#7863b0" stroke-width="2.5" opacity=".85"/><path d="M120 330 C270 315 420 275 560 265 S760 290 880 310" fill="none" stroke="#147b70" stroke-width="2.5" opacity=".85"/><path d="M120 308 C280 290 420 265 560 240 S760 220 880 223" fill="none" stroke="#203a36" stroke-width="5" stroke-linecap="round"/><text x="750" y="118" font-size="14" fill="#bc6a47" font-weight="650" text-anchor="start">ICE（个体）</text><text x="750" y="197" font-size="14" fill="#203a36" font-weight="750" text-anchor="start">PDP（平均）</text><text x="36" y="422" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">PDP 对补集特征求平均；ICE 保留每个样本自己的补集特征。</text></g></svg>