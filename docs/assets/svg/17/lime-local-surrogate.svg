<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">LIME 在目标样本附近拟合局部可解释代理模型</title><desc id="desc">黑箱函数在整个空间可能弯曲。LIME 围绕待解释点采样，按距离给扰动样本加权，再拟合稀疏可解释模型；代理只要求在局部邻域近似黑箱。</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#60746d" stroke-width="1.6"/></marker><marker id="rev" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bc6a47" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif"><text x="36" y="43" font-size="22" fill="#203a36" font-weight="750" text-anchor="start">全局黑箱曲线与局部线性近似</text><path d="M90 350 L900 350" fill="none" stroke="#9aa9a1" stroke-width="1.5" stroke-linecap="round"/><path d="M90 350 L90 92" fill="none" stroke="#9aa9a1" stroke-width="1.5" stroke-linecap="round"/><path d="M100 315 C210 300 270 240 360 205 S530 120 630 160 S790 275 890 300" fill="none" stroke="#7863b0" stroke-width="4"/><path d="M385 95 L650 300" fill="none" stroke="#bc6a47" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="325" y="115" width="300" height="170" rx="16" fill="#eaf4ed" stroke="#b7d3c4"/><circle cx="490" cy="198" r="9" fill="#203a36" stroke="white" stroke-width="2"/><circle cx="400" cy="160" r="6" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="430" cy="230" r="6" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="540" cy="145" r="6" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="570" cy="235" r="6" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="360" cy="205" r="6" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="610" cy="188" r="6" fill="#147b70" stroke="white" stroke-width="2"/><text x="500" y="91" font-size="15" fill="#203a36" font-weight="700" text-anchor="middle">目标样本 x</text><text x="700" y="145" font-size="15" fill="#7863b0" font-weight="700" text-anchor="start">黑箱 f(x)</text><text x="680" y="290" font-size="15" fill="#bc6a47" font-weight="700" text-anchor="start">局部代理 g(z)</text><text x="36" y="402" font-size="14" fill="#52675f" font-weight="550" text-anchor="start">邻域宽度、扰动分布与随机种子会影响解释；先检查局部 fidelity，再解释系数。</text></g></svg>