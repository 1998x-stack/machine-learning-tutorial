<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">矩阵乘法的维度与点积</title><desc id="d">A 为二乘三，B 为三乘二，结果 C 为二乘二。第一行第一列的点积一乘一加二乘零加三乘一等于四。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="38" y="42" font-size="22" fill="#203735" font-weight="750" text-anchor="start">矩阵乘法：行与列相遇，而不是逐元素相乘</text>
<text x="64" y="91" font-size="19" fill="#16786f" font-weight="700" text-anchor="start">A · (2×3)</text><text x="391" y="91" font-size="19" fill="#bc6a47" font-weight="700" text-anchor="start">B · (3×2)</text><text x="748" y="91" font-size="19" fill="#7863b0" font-weight="700" text-anchor="start">C · (2×2)</text>
<rect x="43" y="111" width="55" height="50" rx="6" fill="#eaf5ee" stroke="#cedbd2"/><text x="70" y="143" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">1</text><rect x="107" y="111" width="55" height="50" rx="6" fill="#eaf5ee" stroke="#cedbd2"/><text x="134" y="143" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">2</text><rect x="171" y="111" width="55" height="50" rx="6" fill="#eaf5ee" stroke="#cedbd2"/><text x="198" y="143" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">3</text><rect x="43" y="169" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="70" y="201" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">4</text><rect x="107" y="169" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="134" y="201" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">5</text><rect x="171" y="169" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="198" y="201" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">6</text>
<text x="312" y="189" font-size="32" fill="#516c67" font-weight="700" text-anchor="middle">×</text>
<rect x="374" y="102" width="55" height="50" rx="6" fill="#fff0e6" stroke="#cedbd2"/><text x="401" y="134" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">1</text><rect x="439" y="102" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="466" y="134" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">0</text><rect x="374" y="160" width="55" height="50" rx="6" fill="#fff0e6" stroke="#cedbd2"/><text x="401" y="192" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">0</text><rect x="439" y="160" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="466" y="192" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">1</text><rect x="374" y="218" width="55" height="50" rx="6" fill="#fff0e6" stroke="#cedbd2"/><text x="401" y="250" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">1</text><rect x="439" y="218" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="466" y="250" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">1</text>
<text x="650" y="189" font-size="34" fill="#516c67" font-weight="700" text-anchor="middle">=</text>
<rect x="722" y="126" width="55" height="50" rx="6" fill="#f0edf9" stroke="#cedbd2"/><text x="749" y="158" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">4</text><rect x="787" y="126" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="814" y="158" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">5</text><rect x="722" y="184" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="749" y="216" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">10</text><rect x="787" y="184" width="55" height="50" rx="6" fill="#fff" stroke="#cedbd2"/><text x="814" y="216" font-size="21" fill="#203735" font-weight="700" text-anchor="middle">11</text>
<rect x="35" y="294" width="927" height="70" rx="13" fill="#f1f7f3" stroke="#d9e2dc"/><text x="58" y="320" font-size="19" fill="#203735" font-weight="700" text-anchor="start">C[0,0] = 1×1 + 2×0 + 3×1 = 4</text><text x="58" y="345" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">内维 3 必须匹配；结果形状取外维 (2, 2)，每个元素都是一次行列点积。</text>
</g></svg>