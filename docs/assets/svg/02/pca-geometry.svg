<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">PCA 寻找最大方差的投影轴</title><desc id="d">二维中心化样本在斜向分布。第一主成分指向样本最大方差方向，第二主成分与其正交。PCA 找的不是标签预测最强方向。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="37" y="44" font-size="22" fill="#203735" font-weight="750" text-anchor="start">PCA：先中心化，再寻找数据散布最显著的方向</text>
<rect x="40" y="77" width="580" height="270" rx="13" fill="#fff" stroke="#d9e2dc"/><path d="M100 319 V105 M75 287 H586" fill="none" stroke="#8fa79a" stroke-width="2" />
<path d="M126 282 L497 101" fill="none" stroke="#16786f" stroke-width="2" stroke-width="4"/><path d="M292 340 L371 78" fill="none" stroke="#7863b0" stroke-width="2" stroke-dasharray="8 6"/>
