<text x="500" y="107" font-size="15" fill="#16786f" font-weight="700" text-anchor="start">PC1：最大方差</text><text x="359" y="91" font-size="15" fill="#7863b0" font-weight="700" text-anchor="start">PC2：正交</text>
<rect x="656" y="91" width="308" height="232" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="678" y="125" font-size="18" fill="#203735" font-weight="700" text-anchor="start">协方差与特征向量</text><text x="678" y="157" font-size="19" fill="#16786f" font-weight="700" text-anchor="start">Σ v₁ = λ₁ v₁</text><text x="678" y="184" font-size="19" fill="#7863b0" font-weight="700" text-anchor="start">Σ v₂ = λ₂ v₂</text><text x="678" y="220" font-size="16" fill="#203735" font-weight="500" text-anchor="start">λ₁ ≥ λ₂ ≥ 0</text><text x="678" y="251" font-size="15" fill="#203735" font-weight="500" text-anchor="start">变换坐标 z = Xc · V</text><text x="678" y="282" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">这里 Xc 是逐列减均值的矩阵</text>
</g></svg>