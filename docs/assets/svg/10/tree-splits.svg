<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">基尼不纯度与完全分离的树划分</title><desc id="desc">八个教学样本父节点四个正类四个负类，Gini=0.5。按 x≤4.5 分裂后左侧四个负类，右侧四个正类，两子节点 Gini 都为零。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="44" font-size="22" fill="#203735" font-weight="760" text-anchor="start">树的分裂：为什么这个阈值能把杂质降到零？</text>
<rect x="35" y="82" width="466" height="294" rx="12" fill="#fff" stroke="#d9e2db"/><path d="M87 336 V120 M87 336 H471" fill="none" stroke="#9aaa9e" stroke-width="1.8" stroke-linecap="round" /><path d="M282 130 V337" fill="none" stroke="#795fb4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5"/>
<circle cx="132" cy="282" r="9" fill="#bd6945" stroke="white" stroke-width="2"/><circle cx="167" cy="233" r="9" fill="#bd6945" stroke="white" stroke-width="2"/><circle cx="214" cy="301" r="9" fill="#bd6945" stroke="white" stroke-width="2"/><circle cx="247" cy="202" r="9" fill="#bd6945" stroke="white" stroke-width="2"/>
<circle cx="329" cy="250" r="9" fill="#147e70" stroke="white" stroke-width="2"/><circle cx="366" cy="191" r="9" fill="#147e70" stroke="white" stroke-width="2"/><circle cx="403" cy="287" r="9" fill="#147e70" stroke="white" stroke-width="2"/><circle cx="441" cy="207" r="9" fill="#147e70" stroke="white" stroke-width="2"/>
<text x="289" y="152" font-size="15" fill="#795fb4" font-weight="700" text-anchor="start">x = 4.5</text>
<text x="108" y="357" font-size="14" fill="#bd6945" font-weight="500" text-anchor="start">左：4 个负类</text><text x="322" y="357" font-size="14" fill="#147e70" font-weight="500" text-anchor="start">右：4 个正类</text>
<rect x="561" y="83" width="394" height="88" rx="12" fill="#efebfa" stroke="#d9e2db"/><text x="581" y="110" font-size="19" fill="#795fb4" font-weight="740" text-anchor="start">根节点：4 正 + 4 负</text><text x="581" y="140" font-size="16" fill="#203735" font-weight="500" text-anchor="start">Gini = 1 − (4/8)² − (4/8)² = 0.5</text>
<path d="M752 172 V206 H652 V235" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M752 206 H860 V235" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="557" y="238" width="185" height="94" rx="12" fill="#faefe7" stroke="#d9e2db"/><text x="576" y="268" font-size="17" fill="#bd6945" font-weight="740" text-anchor="start">x ≤ 4.5</text><text x="576" y="301" font-size="18" fill="#203735" font-weight="740" text-anchor="start">Gini = 0</text>
<rect x="771" y="238" width="183" height="94" rx="12" fill="#e7f5ed" stroke="#d9e2db"/><text x="790" y="268" font-size="17" fill="#147e70" font-weight="740" text-anchor="start">x &gt; 4.5</text><text x="790" y="301" font-size="18" fill="#203735" font-weight="740" text-anchor="start">Gini = 0</text>
<text x="34" y="409" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">例子专门构造为完全可分；真实训练使用候选阈值比较加权不纯度，未必达到 0。</text>
</g></svg>