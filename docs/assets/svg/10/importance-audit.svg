<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">MDI 与置换重要性的不同含义</title><desc id="desc">基于不纯度减少的树特征重要性可能偏爱高基数变量；置换重要性则在保留数据上打乱一列并观察模型评分下降。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="43" font-size="21" fill="#203735" font-weight="760" text-anchor="start">特征重要性回答“模型用了什么”，不是“真实原因是什么”</text>
<rect x="35" y="81" width="430" height="296" rx="12" fill="#faefe7" stroke="#d9e2db"/><text x="52" y="117" font-size="20" fill="#bd6945" font-weight="740" text-anchor="start">树内不纯度重要性（MDI）</text>
<rect x="54" y="146" width="389" height="60" rx="12" fill="#fff" stroke="#d9e2db"/><text x="69" y="173" font-size="15" fill="#203735" font-weight="500" text-anchor="start">收集每棵树上某特征带来的</text><text x="69" y="192" font-size="15" fill="#203735" font-weight="500" text-anchor="start">加权不纯度下降</text>
<path d="M249 208 V235" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="54" y="242" width="389" height="83" rx="12" fill="#fff" stroke="#d9e2db"/><text x="69" y="270" font-size="15" fill="#bd6945" font-weight="730" text-anchor="start">限制：高基数类别/连续变量</text><text x="69" y="293" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">可能被赋予偏高分数</text>
<rect x="502" y="81" width="460" height="296" rx="12" fill="#e7f5ed" stroke="#d9e2db"/><text x="519" y="117" font-size="20" fill="#147e70" font-weight="740" text-anchor="start">保留数据的置换重要性</text>
<rect x="518" y="148" width="425" height="54" rx="12" fill="#fff" stroke="#d9e2db"/><text x="535" y="177" font-size="16" fill="#203735" font-weight="500" text-anchor="start">先评估原始验证集得分 S</text>
<path d="M731 204 V229" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="518" y="237" width="425" height="54" rx="12" fill="#fff" stroke="#d9e2db"/><text x="535" y="266" font-size="16" fill="#203735" font-weight="500" text-anchor="start">打乱一列，再评估分数 S'</text>
<text x="537" y="326" font-size="16" fill="#147e70" font-weight="720" text-anchor="start">重要性 = S − S'（依评分方向）</text>
<text x="35" y="409" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">两个方法都不是因果分析；强相关特征会使置换重要性看起来偏低。</text>
</g></svg>