<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">随机森林的自助采样、树间差异与袋外评估</title><desc id="desc">森林中每棵树从训练集中有放回抽样，一些记录重复、另一些未被抽中；未抽中的袋外样本可用于 OOB 估计。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#526b66" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="428" rx="19" fill="#fffdf9" stroke="#d9e2db"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="43" font-size="22" fill="#203735" font-weight="760" text-anchor="start">Bagging：每棵树看到相近但不相同的训练样本</text>
<rect x="36" y="91" width="210" height="257" rx="12" fill="#e7f5ed" stroke="#d9e2db"/><text x="53" y="125" font-size="18" fill="#147e70" font-weight="720" text-anchor="start">原始训练记录</text>
<rect x="53" y="146" width="174" height="25" rx="5" fill="#fff" stroke="#d9e2db"/><text x="68" y="164" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">样本 1</text><rect x="53" y="176" width="174" height="25" rx="5" fill="#fff" stroke="#d9e2db"/><text x="68" y="164" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">样本 2</text><rect x="53" y="206" width="174" height="25" rx="5" fill="#fff" stroke="#d9e2db"/><text x="68" y="164" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">样本 3</text><rect x="53" y="236" width="174" height="25" rx="5" fill="#fff" stroke="#d9e2db"/><text x="68" y="164" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">样本 4</text><rect x="53" y="266" width="174" height="25" rx="5" fill="#fff" stroke="#d9e2db"/><text x="68" y="164" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">样本 5</text><rect x="53" y="296" width="174" height="25" rx="5" fill="#fff" stroke="#d9e2db"/><text x="68" y="164" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">样本 6</text>
<path d="M246 211 H302" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="312" y="92" width="207" height="260" rx="12" fill="#efebfa" stroke="#d9e2db"/><text x="330" y="121" font-size="19" fill="#795fb4" font-weight="720" text-anchor="start">Tree 1</text><text x="330" y="151" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">Bootstrap（有放回）</text><rect x="324" y="172" width="182" height="45" rx="7" fill="#fff" stroke="#d9e2db"/><text x="333" y="200" font-size="12" fill="#526b66" font-weight="550" text-anchor="start">1, 1, 2, 4, 6, 6</text><rect x="324" y="227" width="182" height="45" rx="7" fill="#fff" stroke="#d9e2db"/><text x="333" y="255" font-size="14" fill="#147e70" font-weight="710" text-anchor="start">OOB：3、5</text><text x="328" y="331" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">树会学习不同的分裂</text><path d="M246 211 H528" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="538" y="92" width="207" height="260" rx="12" fill="#faefe7" stroke="#d9e2db"/><text x="556" y="121" font-size="19" fill="#bd6945" font-weight="720" text-anchor="start">Tree 2</text><text x="556" y="151" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">Bootstrap（有放回）</text><rect x="550" y="172" width="182" height="45" rx="7" fill="#fff" stroke="#d9e2db"/><text x="559" y="200" font-size="12" fill="#526b66" font-weight="550" text-anchor="start">2, 3, 3, 4, 4, 5</text><rect x="550" y="227" width="182" height="45" rx="7" fill="#fff" stroke="#d9e2db"/><text x="559" y="255" font-size="14" fill="#147e70" font-weight="710" text-anchor="start">OOB：1、6</text><text x="554" y="331" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">树会学习不同的分裂</text><path d="M246 211 H754" fill="none" stroke="#526b66" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="764" y="92" width="207" height="260" rx="12" fill="#efebfa" stroke="#d9e2db"/><text x="782" y="121" font-size="19" fill="#795fb4" font-weight="720" text-anchor="start">Tree 3</text><text x="782" y="151" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">Bootstrap（有放回）</text><rect x="776" y="172" width="182" height="45" rx="7" fill="#fff" stroke="#d9e2db"/><text x="785" y="200" font-size="12" fill="#526b66" font-weight="550" text-anchor="start">1, 2, 2, 5, 6, 6</text><rect x="776" y="227" width="182" height="45" rx="7" fill="#fff" stroke="#d9e2db"/><text x="785" y="255" font-size="14" fill="#147e70" font-weight="710" text-anchor="start">OOB：3、4</text><text x="780" y="331" font-size="13" fill="#526b66" font-weight="500" text-anchor="start">树会学习不同的分裂</text>
<text x="34" y="407" font-size="14" fill="#526b66" font-weight="500" text-anchor="start">示例索引仅用于说明抽样机制；OOB 统计必须来自对该记录未见过的树，且不代替独立测试。</text>
</g></svg>