<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">贝叶斯定理与基准率：一千人检测示意</title><desc id="d">在一千人中患病率百分之十，敏感度百分之九十，特异度百分之九十五。真阳性九十人，假阳性四十五人，阳性后真实患病概率约三分之二。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="36" y="43" font-size="22" fill="#203735" font-weight="750" text-anchor="start">阳性 ≠ 必然患病：为什么必须考虑基准率？</text>
<rect x="38" y="76" width="196" height="74" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="55" y="106" font-size="22" fill="#203735" font-weight="750" text-anchor="start">1000 人</text><text x="55" y="131" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">患病率 10%</text>
<path d="M235 113 H276 V190 H306" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><path d="M276 113 V285 H306" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="308" y="158" width="223" height="67" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="326" y="184" font-size="18" fill="#16786f" font-weight="750" text-anchor="start">患病 100</text><text x="326" y="208" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">敏感度 90%</text>
<rect x="308" y="251" width="223" height="67" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="326" y="277" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="start">未患病 900</text><text x="326" y="302" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">假阳性率 5%</text>
<path d="M531 189 H572" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><path d="M531 281 H572" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<rect x="577" y="158" width="164" height="67" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="590" y="184" font-size="18" fill="#16786f" font-weight="750" text-anchor="start">真阳性 90</text><text x="590" y="208" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">假阴性 10</text>
<rect x="577" y="251" width="164" height="67" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="590" y="278" font-size="18" fill="#bc6a47" font-weight="750" text-anchor="start">假阳性 45</text><text x="590" y="302" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">真阴性 855</text>
<rect x="771" y="102" width="195" height="224" rx="13" fill="#f0edf9" stroke="#d9e2dc"/><text x="789" y="141" font-size="16" fill="#7863b0" font-weight="650" text-anchor="start">阳性结果共</text><text x="789" y="181" font-size="32" fill="#203735" font-weight="780" text-anchor="start">135 人</text><text x="789" y="226" font-size="15" fill="#7863b0" font-weight="700" text-anchor="start">P(患病 | 阳性)</text><text x="789" y="260" font-size="24" fill="#203735" font-weight="740" text-anchor="start">90 / 135</text><text x="789" y="293" font-size="22" fill="#7863b0" font-weight="750" text-anchor="start">≈ 66.7%</text>
<text x="38" y="361" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">教学设定：各百分比是为演示条件概率设定的参数，不代表任何真实检测性能。</text>
</g></svg>