<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">轮廓系数的簇内与簇间距离</title><desc id="desc">对一个样本 i，a(i)是同簇其他点的平均距离，b(i)是到其他簇的最小平均距离，示意 a=2、b=6，轮廓系数为(6-2)/6=2/3。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" font-size="21" fill="#213a37" font-weight="750" text-anchor="start">簇内要紧密，簇间要分离：Silhouette</text>
<rect x="36" y="84" width="583" height="304" rx="12" fill="#fff" stroke="#d8e2d9"/>
<circle cx="196" cy="203" r="8" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="226" cy="232" r="8" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="168" cy="254" r="8" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="220" cy="274" r="8" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="251" cy="186" r="8" fill="#147b70" stroke="white" stroke-width="2"/>
<circle cx="425" cy="160" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="456" cy="200" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="408" cy="246" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="466" cy="280" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="511" cy="226" r="8" fill="#c4774b" stroke="white" stroke-width="2"/>
<circle cx="196" cy="203" r="11" fill="#725cb0" stroke="white" stroke-width="2"/>
<path d="M196 203 L226 232" fill="none" stroke="#147b70" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M196 203 L425 160" fill="none" stroke="#c4774b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="228" y="194" font-size="15" fill="#147b70" font-weight="720" text-anchor="start">a(i)：同簇均距</text><text x="332" y="153" font-size="14" fill="#c4774b" font-weight="700" text-anchor="start">b(i)：最近其他簇均距</text>
<text x="165" y="348" font-size="14" fill="#725cb0" font-weight="730" text-anchor="start">点 i</text>
<rect x="654" y="104" width="309" height="247" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="675" y="139" font-size="21" fill="#725cb0" font-weight="760" text-anchor="start">Silhouette</text><text x="675" y="178" font-size="16" fill="#213a37" font-weight="700" text-anchor="start">s(i) = (b−a)/max(a,b)</text><text x="675" y="217" font-size="16" fill="#57706c" font-weight="500" text-anchor="start">示意：a=2，b=6</text><text x="675" y="256" font-size="17" fill="#213a37" font-weight="500" text-anchor="start">s = (6−2)/6</text><text x="675" y="287" font-size="23" fill="#147b70" font-weight="760" text-anchor="start">= 0.667</text>
<text x="35" y="429" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">图中的连线仅表示概念；a 与 b 是多点距离均值，不能通过单条线段直接读取。</text>
</g></svg>