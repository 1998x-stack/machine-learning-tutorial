<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">DBSCAN 中核心点、边界点与噪声</title><desc id="desc">eps=65, min_samples=4 含自身。左边六个点中五个密集点是核心点，(322,249) 为仅与一个核心点相邻的边界点；右侧(680,175)是噪声点。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="46" font-size="22" fill="#213a37" font-weight="760" text-anchor="start">DBSCAN：密度连通，而不是事先指定 K</text>
<rect x="33" y="79" width="637" height="315" rx="12" fill="#fff" stroke="#d8e2d9"/>
<circle cx="245" cy="225" r="9" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="215" cy="230" r="9" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="260" cy="245" r="9" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="230" cy="190" r="9" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="275" cy="205" r="9" fill="#147b70" stroke="white" stroke-width="2"/>
<circle cx="325" cy="252" r="9" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="605" cy="176" r="9" fill="#725cb0" stroke="white" stroke-width="2"/>
<circle cx="245" cy="225" r="65" fill="#c9e9d5" fill-opacity=".22" stroke="#147b70" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="325" cy="252" r="65" fill="#faeee6" fill-opacity=".12" stroke="#c4774b" stroke-width="1.8" stroke-dasharray="6 6"/>
<text x="161" y="128" font-size="15" fill="#147b70" font-weight="710" text-anchor="start">核心点邻域</text><text x="326" y="329" font-size="15" fill="#c4774b" font-weight="740" text-anchor="start">边界点</text><text x="552" y="146" font-size="15" fill="#725cb0" font-weight="740" text-anchor="start">噪声</text>
<rect x="698" y="104" width="264" height="261" rx="12" fill="#e9f5ee" stroke="#d8e2d9"/><text x="717" y="138" font-size="18" fill="#147b70" font-weight="750" text-anchor="start">eps = 65</text><text x="717" y="169" font-size="17" fill="#213a37" font-weight="720" text-anchor="start">min_samples = 4</text>
<text x="717" y="221" font-size="15" fill="#213a37" font-weight="500" text-anchor="start">核心：邻居数 ≥ 4</text><text x="717" y="250" font-size="15" fill="#213a37" font-weight="500" text-anchor="start">边界：可从核心到达</text><text x="717" y="279" font-size="15" fill="#213a37" font-weight="500" text-anchor="start">噪声：尚不可达</text><text x="717" y="322" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">计数包含样本自身</text>
<text x="34" y="428" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">距离单位为示意画布坐标，eps 的实际意义取决于特征缩放与距离度量；边界点并非独立的新簇。</text>
</g></svg>