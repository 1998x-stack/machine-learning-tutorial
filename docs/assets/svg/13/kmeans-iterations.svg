<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">KMeans 分配与更新的两个迭代阶段</title><desc id="desc">初始中心 A(185,155)、B(700,285)，按欧氏距离给六个点分组，然后分别更新到各类点平均位置 A(246.7,220)、B(730,240)。坐标为示意画布像素。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="45" font-size="22" fill="#213a37" font-weight="760" text-anchor="start">K-Means：交替执行“分配”与“更新均值”</text>
<rect x="34" y="81" width="618" height="307" rx="12" fill="#fff" stroke="#d8e2d9"/><path d="M83 354 V119 M83 354 H622" fill="none" stroke="#9faea4" stroke-width="1.8" stroke-linecap="round" />
<circle cx="210" cy="220" r="8" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="260" cy="180" r="8" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="270" cy="260" r="8" fill="#147b70" stroke="white" stroke-width="2"/>
<circle cx="700" cy="190" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="760" cy="230" r="8" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="730" cy="300" r="8" fill="#c4774b" stroke="white" stroke-width="2"/>
<path d="M185 155 L246.7 220" fill="none" stroke="#147b70" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/><path d="M700 285 L730 240" fill="none" stroke="#c4774b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<circle cx="185" cy="155" r="11" fill="#725cb0" stroke="white" stroke-width="2"/><circle cx="700" cy="285" r="11" fill="#725cb0" stroke="white" stroke-width="2"/><circle cx="246.7" cy="220" r="11" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="730" cy="240" r="11" fill="#c4774b" stroke="white" stroke-width="2"/>
<text x="122" y="136" font-size="14" fill="#725cb0" font-weight="730" text-anchor="start">初始中心 A</text><text x="782" y="296" font-size="14" fill="#725cb0" font-weight="730" text-anchor="start">初始中心 B</text>
<text x="276" y="225" font-size="14" fill="#147b70" font-weight="750" text-anchor="start">更新中心 A</text><text x="750" y="223" font-size="14" fill="#c4774b" font-weight="750" text-anchor="start">更新中心 B</text>
<rect x="679" y="99" width="274" height="255" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="699" y="132" font-size="19" fill="#725cb0" font-weight="750" text-anchor="start">第一步：分配</text><text x="699" y="164" font-size="15" fill="#213a37" font-weight="500" text-anchor="start">每个点选最近中心</text>
<text x="699" y="217" font-size="19" fill="#725cb0" font-weight="750" text-anchor="start">第二步：更新</text><text x="699" y="246" font-size="15" fill="#213a37" font-weight="500" text-anchor="start">中心 = 所属点的均值</text>
<text x="699" y="300" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">重复直到停止条件满足</text>
<text x="35" y="429" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">图是按构造坐标逐点计算均值的一轮更新，不代表保证收敛到全局最优。中心可能依赖初始化。</text>
</g></svg>