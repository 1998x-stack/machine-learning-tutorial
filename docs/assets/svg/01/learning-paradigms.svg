<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">监督、无监督与强化学习的信号路径</title><desc id="d">监督学习使用标签给出每次预测的比较目标；无监督学习从没有标签的数据寻找结构；强化学习从环境交互获得奖励信号。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="44" font-size="22" fill="#203735" font-weight="750" text-anchor="start">学习问题的三条典型反馈路径</text>
<rect x="35" y="75" width="296" height="272" rx="13" fill="#fff" stroke="#d9e2dc"/><rect x="51" y="91" width="264" height="46" rx="9" fill="#eaf5ee" stroke="#eaf5ee"/><text x="67" y="120" font-size="21" fill="#16786f" font-weight="730" text-anchor="start">监督学习</text><rect x="62" y="154" width="242" height="48" rx="13" fill="#f7f8f5" stroke="#d9e2dc"/><text x="77" y="184" font-size="16" fill="#203735" font-weight="500" text-anchor="start">特征 x + 标签 y</text><path d="M183 204 v25" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="62" y="234" width="242" height="48" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="77" y="264" font-size="16" fill="#203735" font-weight="500" text-anchor="start">预测 ŷ → 监督损失</text><text x="62" y="319" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">用于分类 / 回归</text><rect x="360" y="75" width="296" height="272" rx="13" fill="#fff" stroke="#d9e2dc"/><rect x="376" y="91" width="264" height="46" rx="9" fill="#fff0e6" stroke="#fff0e6"/><text x="392" y="120" font-size="21" fill="#bc6a47" font-weight="730" text-anchor="start">无监督学习</text><rect x="387" y="154" width="242" height="48" rx="13" fill="#f7f8f5" stroke="#d9e2dc"/><text x="402" y="184" font-size="16" fill="#203735" font-weight="500" text-anchor="start">只有特征 x</text><path d="M508 204 v25" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="387" y="234" width="242" height="48" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="402" y="264" font-size="16" fill="#203735" font-weight="500" text-anchor="start">学习结构或表示</text><text x="387" y="319" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">用于聚类 / 降维</text><rect x="685" y="75" width="296" height="272" rx="13" fill="#fff" stroke="#d9e2dc"/><rect x="701" y="91" width="264" height="46" rx="9" fill="#f0edf9" stroke="#f0edf9"/><text x="717" y="120" font-size="21" fill="#7863b0" font-weight="730" text-anchor="start">强化学习</text><rect x="712" y="154" width="242" height="48" rx="13" fill="#f7f8f5" stroke="#d9e2dc"/><text x="727" y="184" font-size="16" fill="#203735" font-weight="500" text-anchor="start">状态 s + 可选动作 a</text><path d="M833 204 v25" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="712" y="234" width="242" height="48" rx="13" fill="#f0edf9" stroke="#d9e2dc"/><text x="727" y="264" font-size="16" fill="#203735" font-weight="500" text-anchor="start">奖励 r 与下一状态</text><text x="712" y="319" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">用于序列决策</text>
</g></svg>