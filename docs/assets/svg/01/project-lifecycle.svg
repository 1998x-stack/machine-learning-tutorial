<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">训练、验证、测试的正确分工</title><desc id="d">先隔离测试数据，训练集用于拟合参数，验证集用于选择模型与超参数，测试集用于最后一次独立评估，且生产反馈是另一个评估环节。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#597b73" stroke-width="1.6"/></marker></defs><rect x="1" y="1" width="998" height="388" rx="18" fill="#fcfbf7" stroke="#d9e2dc"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="36" y="42" font-size="22" fill="#203735" font-weight="750" text-anchor="start">从数据到可信预测：每条数据走哪条路？</text>
<rect x="38" y="77" width="190" height="70" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="56" y="105" font-size="19" fill="#16786f" font-weight="700" text-anchor="start">原始样本</text><text x="56" y="129" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">X 与目标 y</text>
<path d="M229 112 H279" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="281" y="77" width="196" height="70" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="299" y="106" font-size="17" fill="#203735" font-weight="700" text-anchor="start">先定义切分规则</text><text x="299" y="130" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">随机 / 分组 / 时间</text>
<path d="M477 112 H520" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><path d="M522 70 V315" fill="none" stroke="#d9e2dc" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M477 112 H505 V169 H549" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="550" y="137" width="205" height="65" rx="13" fill="#eaf5ee" stroke="#d9e2dc"/><text x="567" y="162" font-size="17" fill="#16786f" font-weight="730" text-anchor="start">训练集</text><text x="567" y="185" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">拟合参数 θ</text><path d="M477 112 H505 V246 H549" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="550" y="214" width="205" height="65" rx="13" fill="#fff0e6" stroke="#d9e2dc"/><text x="567" y="239" font-size="17" fill="#bc6a47" font-weight="730" text-anchor="start">验证集</text><text x="567" y="262" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">比较候选模型</text><path d="M477 112 H505 V323 H549" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" /><rect x="550" y="291" width="205" height="65" rx="13" fill="#f0edf9" stroke="#d9e2dc"/><text x="567" y="316" font-size="17" fill="#7863b0" font-weight="730" text-anchor="start">测试集</text><text x="567" y="339" font-size="14" fill="#516c67" font-weight="500" text-anchor="start">一次性最终评估</text>
<rect x="793" y="157" width="166" height="75" rx="13" fill="#fff" stroke="#d9e2dc"/><text x="807" y="185" font-size="18" fill="#16786f" font-weight="700" text-anchor="start">上线 / 监控</text><text x="807" y="207" font-size="13" fill="#516c67" font-weight="500" text-anchor="start">漂移与业务指标</text><path d="M755 169 H790" fill="none" stroke="#516c67" stroke-width="2.1" stroke-linecap="round" marker-end="url(#a)" />
<text x="36" y="355" font-size="15" fill="#bc6a47" font-weight="650" text-anchor="start">关键边界：测试集不能参与标准化均值、缺失值统计、调参与特征选择。</text>
</g></svg>