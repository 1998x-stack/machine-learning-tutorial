<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">PCA 线性投影与 t-SNE 非线性邻域嵌入的区别</title><desc id="desc">PCA 沿线性主轴投影并优化方差重建，t-SNE 优化局部邻域的二维相似性布局；不同图中的距离不可直接等量比较。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="34" y="45" font-size="22" fill="#213a37" font-weight="750" text-anchor="start">两种“降到二维”解释的是不同目标</text>
<rect x="35" y="86" width="446" height="294" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="55" y="117" font-size="18" fill="#147b70" font-weight="740" text-anchor="start">PCA：最大方差的线性方向</text><path d="M78 331 V136 M78 331 H442" fill="none" stroke="#a2b1a7" stroke-width="1.7" stroke-linecap="round" /><path d="M110 292 L404 112" fill="none" stroke="#147b70" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6"/><circle cx="109" cy="214" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="141" cy="202" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="183" cy="189" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="213" cy="171" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="263" cy="153" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="298" cy="142" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="336" cy="124" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="368" cy="112" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><text x="53" y="361" font-size="13" fill="#57706c" font-weight="500" text-anchor="start">方向可用于新数据的同一线性变换</text><rect x="516" y="86" width="446" height="294" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="536" y="117" font-size="18" fill="#c4774b" font-weight="740" text-anchor="start">t-SNE：邻近关系优先</text><path d="M559 331 V136 M559 331 H923" fill="none" stroke="#a2b1a7" stroke-width="1.7" stroke-linecap="round" /><circle cx="585" cy="161" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="608" cy="143" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="627" cy="176" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="655" cy="156" r="7" fill="#147b70" stroke="white" stroke-width="2"/><circle cx="820" cy="257" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="857" cy="274" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="837" cy="301" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><circle cx="873" cy="286" r="7" fill="#c4774b" stroke="white" stroke-width="2"/><text x="534" y="361" font-size="13" fill="#57706c" font-weight="500" text-anchor="start">簇间位置 / 形状慎重解释</text>
<text x="35" y="428" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">两幅图仅为构造示意，非同一数据的算法输出；t-SNE 的簇间间距和簇面积不宜直接作原始密度结论。</text>
</g></svg>