<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">目标编码交叉拟合与测试集转换流程</title><desc id="desc">交叉拟合时每个训练折的类别均值只由其他训练折的标签估计；最终测试集使用在完整开发训练部分拟合出的编码器转换，不使用测试标签。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" font-size="22" fill="#213a37" font-weight="750" text-anchor="start">目标编码：编码中不能包含当前样本的标签</text>
<rect x="36" y="91" width="247" height="75" rx="12" fill="#e9f5ee" stroke="#d8e2d9"/><text x="54" y="121" font-size="18" fill="#147b70" font-weight="750" text-anchor="start">训练开发集</text><text x="54" y="148" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">类别 X + 目标 y</text>
<path d="M285 128 H327" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="330" y="89" width="283" height="81" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="348" y="118" font-size="18" fill="#213a37" font-weight="740" text-anchor="start">训练折交叉拟合</text><text x="348" y="148" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">对折 k 用其他折的标签</text>
<path d="M614 128 H659" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="663" y="91" width="291" height="75" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="680" y="121" font-size="17" fill="#725cb0" font-weight="740" text-anchor="start">训练样本 OOF 编码</text><text x="680" y="148" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">不使用该行自身的 y</text>
<rect x="36" y="236" width="247" height="79" rx="12" fill="#faeee6" stroke="#d8e2d9"/><text x="54" y="267" font-size="18" fill="#c4774b" font-weight="750" text-anchor="start">独立测试数据</text><text x="54" y="292" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">仅有类别 X，无目标 y</text>
<path d="M285 273 H326" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="331" y="236" width="283" height="80" rx="12" fill="#fff" stroke="#d8e2d9"/><text x="348" y="264" font-size="16" fill="#147b70" font-weight="720" text-anchor="start">编码器在完整训练集 fit</text><text x="348" y="291" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">使用最终训练集统计表</text>
<path d="M616 273 H660" fill="none" stroke="#57706c" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="663" y="236" width="291" height="80" rx="12" fill="#efecf8" stroke="#d8e2d9"/><text x="680" y="265" font-size="17" fill="#725cb0" font-weight="720" text-anchor="start">测试集只调用 transform</text><text x="680" y="291" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">未知类别要有回退策略</text>
<text x="35" y="411" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">这是交叉拟合的概念流程。用全量数据直接按标签算类别均值再随机拆分，会造成严重信息泄漏。</text>
</g></svg>