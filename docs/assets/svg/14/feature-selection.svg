<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">过滤法包裹法嵌入法的特征选择信息边界</title><desc id="desc">过滤法按统计分数筛特征、包裹法用验证性能比较子集、嵌入法在模型拟合中产生权重/选择；所有需要拟合的数据选择应位于交叉验证训练折内。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#57706c" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="998" height="448" rx="18" fill="#fffdf9" stroke="#d8e2d9"/><g font-family="system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="35" y="45" font-size="21" fill="#213a37" font-weight="750" text-anchor="start">特征选择不可以在交叉验证之前偷看验证数据</text>
<rect x="35" y="94" width="304" height="237" rx="12" fill="#fff" stroke="#d8e2d9"/><rect x="51" y="112" width="272" height="54" rx="8" fill="#e9f5ee" stroke="#d8e2d9"/><text x="63" y="147" font-size="20" fill="#147b70" font-weight="760" text-anchor="start">Filter</text><text x="59" y="208" font-size="17" fill="#213a37" font-weight="680" text-anchor="start">统计检验 / 互信息</text><text x="59" y="250" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">拟合选取器</text><text x="59" y="292" font-size="14" fill="#147b70" font-weight="740" text-anchor="start">只能使用当前训练折</text><rect x="358" y="94" width="304" height="237" rx="12" fill="#fff" stroke="#d8e2d9"/><rect x="374" y="112" width="272" height="54" rx="8" fill="#faeee6" stroke="#d8e2d9"/><text x="386" y="147" font-size="20" fill="#c4774b" font-weight="760" text-anchor="start">Wrapper</text><text x="382" y="208" font-size="17" fill="#213a37" font-weight="680" text-anchor="start">RFE / 顺序选择</text><text x="382" y="250" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">拟合候选并比较评分</text><text x="382" y="292" font-size="14" fill="#c4774b" font-weight="740" text-anchor="start">只能使用当前训练折</text><rect x="681" y="94" width="304" height="237" rx="12" fill="#fff" stroke="#d8e2d9"/><rect x="697" y="112" width="272" height="54" rx="8" fill="#efecf8" stroke="#d8e2d9"/><text x="709" y="147" font-size="20" fill="#725cb0" font-weight="760" text-anchor="start">Embedded</text><text x="705" y="208" font-size="17" fill="#213a37" font-weight="680" text-anchor="start">L1 / 树重要性</text><text x="705" y="250" font-size="14" fill="#57706c" font-weight="500" text-anchor="start">训练模型内生成选择</text><text x="705" y="292" font-size="14" fill="#725cb0" font-weight="740" text-anchor="start">只能使用当前训练折</text>
<path d="M54 369 H950" fill="none" stroke="#d8e2d9" stroke-width="2" stroke-linecap="round" /><text x="56" y="402" font-size="17" fill="#213a37" font-weight="710" text-anchor="start">Pipeline：fold_train → selector.fit → transform → estimator.fit → fold_val.score</text>
<text x="35" y="433" font-size="13" fill="#57706c" font-weight="500" text-anchor="start">目标相关选择器若在拆分前 fit，会导致验证/测试信息泄漏；无监督预处理也可能泄漏测试分布。</text>
</g></svg>